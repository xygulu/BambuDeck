name: deck
description: BambuDeck - Bambu Lab printer & camera monitoring for desktop and mobile.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  bambu_protocol:
    path: ../../packages/bambu_protocol
  collection: ^1.19.1
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # tool/ diagnostics scripts (camera protocol probing) speak MQTT directly.
  mqtt_client: ^10.13.0

flutter:
  uses-material-design: true
  assets:
    # Bundled plate-swap model (单盘换盘): its tail gcode shakes the finished
    # print off and ejects the plate - "printing" it IS the plate swap.
    - assets/plate_swap/auto_plate_swap.3mf
