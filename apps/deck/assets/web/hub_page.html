const byCam = id => lastCameras.find(c => c.id === id) || null;

// App 的 _orient(): 先水平翻转再顺时针旋转。画面和云台盘用同一个变换,
// 云台键跟着画面一起转/翻, 命令本身保持初始画面的语义。
function camTransform(c) {
  const parts = [];
  if (c.flipH) parts.push('scaleX(-1)');
  if (c.rotation) parts.push(`rotate(${c.rotation}deg)`);
  return parts.join(' ') || 'none';
}

function hasCamControls(c) { return !!c.rtsp; }

function camChipsHtml(c) {
  if (!hasCamControls(c)) return '';
  return `<div class="camchips">
    ${c.canQuality ? `<button class="chip" data-cam-act="quality" data-cam="${esc(c.id)}"
      title="切换主/子码流">${c.quality === 'sub' ? '子码流' : '主码流'}</button>` : ''}
    ${c.audio ? `<button class="chip icon" data-cam-act="mute" data-cam="${esc(c.id)}"
      title="静音" aria-pressed="false">${CAM_ICON.volOn}</button>` : ''}
    <button class="chip icon" data-cam-act="orient" data-cam="${esc(c.id)}"
      title="画面翻转 / 旋转">${CAM_ICON.rotate}</button>
  </div>`;
}

// 云台盘: 常显 (不可用时变淡), 按住方向键每 250ms 重发, 松手发 stop。
function camPadHtml(c) {
  if (!c.ptz) return '';
  return `<div class="ptz" data-cam="${esc(c.id)}" title="云台"
      style="transform:${camTransform(c)}">
    <div class="mid">${CAM_ICON.cam}</div>
    <button class="up" data-ptz="up" aria-label="上" title="上">${CAM_ICON.up}</button>
    <button class="down" data-ptz="down" aria-label="下" title="下">${CAM_ICON.down}</button>
    <button class="left" data-ptz="left" aria-label="左" title="左">${CAM_ICON.left}</button>
    <button class="right" data-ptz="right" aria-label="右" title="右">${CAM_ICON.right}</button>
  </div>`;
}

function camCard(c) {
  const card = document.createElement('div');
  card.className = 'card cam';
  card.dataset.cam = c.id;
  if (c.stream) {
    card.innerHTML = `<div class="prow"><div class="pident"><div class="name">${esc(c.name)}</div>
        <div class="meta">${esc(c.type || '')}</div></div></div>
      <div class="camview">
        <canvas class="shot cstream" aria-label="${esc(c.name)}" data-cam="${esc(c.id)}"
          data-src="${esc(c.stream)}" style="transform:${camTransform(c)}"></canvas>
        ${c.audioStream ? `<audio class="camaudio" data-cam="${esc(c.id)}"
          data-src="${esc(c.audioStream)}" preload="none" playsinline></audio>` : ''}
        ${camChipsHtml(c)}${camPadHtml(c)}
      </div>`;
    card.querySelector('canvas').addEventListener('click', () => zoomOn(c.id));
  } else {
    card.innerHTML = `<div class="prow"><div class="pident"><div class="name">${esc(c.name)}</div>
        <div class="meta">${esc(c.type || '')}</div></div></div>
      <div class="off">${c.enabled === false ? '已停用' : '视频源不可用'}</div>`;
  }
  return card;
}

// 摄像头墙: 只显示绑定到这台打印机的画面 (与 App 的 CameraWallSection 一致)
function paneCameras(p) {
  return lastCameras.filter(c => (c.printers || []).includes(p.id));
}

// 只在这些字段变了才重建卡片; 翻转/旋转/静音/码流走 paintCam，重画会把
// 每条 MJPEG 流都断一次。
const camSigOf = c => [c.id, c.name, c.type, c.stream || '', c.audioStream || '',
  c.enabled, c.canQuality ? 1 : 0, c.ptz ? 1 : 0, c.audio ? 1 : 0,
  c.rtsp ? 1 : 0].join('|');

function renderWall(p) {
  const el = $('camwall');
  if (!el) return;
  const cams = paneCameras(p);
  const sig = p.id + '#' + cams.map(camSigOf).join('#');
  if (sig === wallSig) { syncWalls(); return; }
  wallSig = sig;
  dropStreams(el);
  if (!cams.length) {
    el.innerHTML = '<div class="wall-empty">这台打印机没有绑定摄像头。在 Mac 的 BambuDeck → 摄像头里可以绑定。</div>';
    return;
  }
  el.innerHTML = '';
  for (const c of cams) {
    el.appendChild(camCard(c));
    // 云台能不能用由服务端探测 (ONVIF / HCNetSDK 兜底): 先显示, 探不通变淡。
    if (c.ptz) probePtz(c);
  }
  syncWalls();
  paintCam();
}

// 放大视图里正在看的那台。它已经在放大图里挂着一条流了。
function zoomedCam() {
  const z = $('zoom');
  if (!z || !z.classList.contains('show')) return null;
  const img = z.querySelector('canvas[data-cam]');
  return img ? img.dataset.cam : null;
}

/* 只挂「真的在屏幕上」的画面。
   iOS/Chrome 对同一个站点只给 6 条 HTTP 连接: 一面墙 5 台摄像头全挂,
   再加 WebSocket 和一路声音就正好 7 条 —— 超了以后新的 <img> 一直排队,
   一条帧也收不到, 表现是「切几次打印机、用一会儿就整页全黑, 杀掉 App
   重开才好」(反馈 2026-10-26)。手机一屏就一两张卡, 其余挂上去也没人看,
   白占名额, 所以按可见性挂: 滚进来才连, 滚出去就断。 */
const NEAR_MARGIN = 160; // 提前 160px 开始连, 滚动时不至于看到黑块
let viewIO = null;

function nearNow(img) {
  const r = img.getBoundingClientRect();
  const vh = window.innerHeight || document.documentElement.clientHeight || 0;
  return r.bottom > -NEAR_MARGIN && r.top < vh + NEAR_MARGIN;
}

// 第一次见到这张图时同步量一次几何 (IntersectionObserver 的回调要等下一帧,
// 等它就等于开场先黑一下), 之后交给观察器跟滚动。
function trackNear(img) {
  if (!img.dataset.tracked) {
    img.dataset.tracked = '1';
    img.dataset.near = nearNow(img) ? '1' : '0';
    if (typeof IntersectionObserver !== 'undefined') {
      viewIO = viewIO || new IntersectionObserver(entries => {
        let changed = false;
        for (const e of entries) {
          const on = e.isIntersecting ? '1' : '0';
          if (e.target.dataset.near === on) continue;
          e.target.dataset.near = on;
          changed = true;
        }
        if (changed) { syncWalls(); syncCameras(); }
      }, { rootMargin: `${NEAR_MARGIN}px 0px` });
      viewIO.observe(img);
    }
  }
  return img.dataset.near === '1';
}

// 换机器/换卡片前先摘流: 直接把旧 DOM 丢掉的话 <img> 的 MJPEG 请求没人去关,
// 连接会一直挂在浏览器的名额里, 切几台机器就满了。
function dropStreams(root) {
  if (!root) return;
  for (const img of root.querySelectorAll('canvas.cstream')) unmountStream(img);
  for (const a of root.querySelectorAll('audio.camaudio')) unmountAudio(a);
}

// 摄像头墙的 <img> 只在看得见时挂 MJPEG, 切走/换机器就摘掉。
// 放大中的那台墙上不再挂: 同一台机内摄像头第二条连接会把第一条踢掉。
function syncWalls() {
  const visible = document.body.dataset.tab === 'printers' &&
    (WIDE() || document.body.dataset.view === 'detail');
  const zc = zoomedCam();
  for (const img of document.querySelectorAll('#camwall canvas')) {
    const near = trackNear(img);
    if (visible && near && !(zc && img.dataset.cam === zc)) attachStream(img);
    else unmountStream(img);
  }
  syncAudio(document.querySelectorAll('#camwall audio.camaudio'), visible);
}

// 声音跟着画面一起挂/摘; 静音是全局开关, 关着就不占带宽。
//
// 手机上每路声音都是额外一条 HTTP 长连接, 而 Safari 每个站只给 6 条:
// 2 台摄像头就是 2 画面 + 2 声音 + WebSocket = 5, 再多一条重试就超,
// 超了以后新的 <img> 全部不出帧 —— 表现就是「整页全黑」(反馈 2026-10-26)。
// 所以窄屏只给放大中的那台出声, 宽屏 (电脑) 才全部挂。
function syncAudio(list, visible) {
  const zimg = document.querySelector('#zoom.show canvas[data-cam]');
  const zoomCam = zimg ? zimg.dataset.cam : null;
  for (const a of list) {
    const want = visible && (WIDE() || a.dataset.cam === zoomCam);
    if (want) mountAudio(a);
    else unmountAudio(a);
  }
}

/* —— 画面通道: 所有画面共用一条 /ws-cam WebSocket ——

   为什么换掉 fetch + canvas: WebKit(iOS Safari / WKWebView)的 fetch 读不出
   永不结束的响应体 —— 能拿到 200 和 body, 第一次 read() 立刻
   `TypeError: Load failed`。2026-10-26 用 Playwright 的 WebKit 对照实测:
   换成最小的 Node MJPEG 服务器、换 Content-Type、换分块/关连接界定, 一样
   失败; 同一个页面在电脑的 Chromium 上正常 —— 所以「电脑有画面、iOS 全黑」。

   <img src=MJPEG> 在 iOS 上能显示, 但页面把它摘掉时 WebKit 不真的关连接,
   同源名额被半死连接吃光, 一个黑屏变全黑。

   现在所有画面帧走一条 WS: 一个站点只占 1 条连接, 退订立刻生效, 服务端
   一帧一 ack (客户端画完才回), 手机跟不上时不会囤积过期帧, 也不会像长
   连接流那样把 Cloudflare 隧道的连接级窗口堵死。
   帧格式: [1 字节 id 长度][id][JPEG]。 */
const streamOf = new Map(); // canvas -> {cam}
let camWS = null;
let camSubs = new Set();    // 服务端那边已经订阅的 id
let camBackoff = 0;
let camPingAt = 0;          // 发出 ping 的时刻; 收到任何消息清零

// 现在需要哪些画面 (顺手把已经从 DOM 里摘掉的清出去)。
function camWant() {
  const want = new Set();
  for (const el of [...streamOf.keys()]) {
    if (!el.isConnected) { streamOf.delete(el); continue; }
    const id = el.dataset.cam;
    if (id) want.add(id);
  }
  return want;
}

function camSend(obj) {
  const s = camWS;
  if (!s || s.readyState !== WebSocket.OPEN) return false;
  try { s.send(JSON.stringify(obj)); return true; } catch (_) { return false; }
}

function camConnect() {
  if (camWS && camWS.readyState <= WebSocket.OPEN) return camWS;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const url = `${proto}://${location.host}/ws-cam?token=` +
    encodeURIComponent(TOKEN || '');
  let sock;
  try { sock = new WebSocket(url); } catch (_) { return null; }
  sock.binaryType = 'arraybuffer';
  camWS = sock;
  camSubs = new Set();
  camPingAt = 0;
  sock.onopen = () => {
    camBackoff = 0;
    camSyncSubs();
  };
  sock.onmessage = ev => {
    camPingAt = 0;
    if (typeof ev.data === 'string') return; // pong
    onFrame(ev.data);
  };
  sock.onclose = () => {
    if (camWS === sock) camWS = null;
    camSubs = new Set();
    camPingAt = 0;
    if (!camWant().size || document.visibilityState !== 'visible') return;
    // 断线重连退避, 别把手机的名额和电池耗在连不上的时候。
    camBackoff = Math.min(camBackoff + 1, 5);
    setTimeout(() => {
      if (document.visibilityState === 'visible') camSyncSubs();
    }, 1500 * camBackoff);
  };
  return sock;
}

// 把「现在要哪些画面」同步给服务端。
// 服务端把 sub 当**全量集合**处理 (没列出的就退订), 所以这里发的永远是
// 完整一份; 只有集合真的变了才发, 免得切页签时刷一串没用的消息。
function camSyncSubs() {
  const want = camWant();
  if (!want.size && !camSubs.size) return; // 没什么要看的, 也不用连
  const sock = camConnect(); // 已有连接就返回它, 没有才新开
  if (!sock || sock.readyState !== WebSocket.OPEN) return;
  const same = want.size === camSubs.size &&
    [...want].every(id => camSubs.has(id));
  if (same) return;
  if (camSend({ sub: [...want] })) camSubs = new Set(want);
}

// 收到一帧: [idLen][id][JPEG], 画完所有显示这台摄像头的画布再回 ack。
function onFrame(buf) {
  if (!(buf instanceof ArrayBuffer) || buf.byteLength < 3) return;
  const u8 = new Uint8Array(buf);
  const idLen = u8[0];
  if (idLen < 1 || u8.byteLength < 1 + idLen + 1) return;
  const id = new TextDecoder().decode(u8.subarray(1, 1 + idLen));
  const jpg = u8.subarray(1 + idLen);
  const targets = [];
  for (const el of streamOf.keys()) {
    if (el.dataset.cam === id && el.isConnected &&
        el.dataset.mounted === '1') targets.push(el);
  }
  if (!targets.length) { camSend({ ack: id }); return; }
  (async () => {
    for (const el of targets) {
      await drawFrame(el, jpg);
      el.dataset.frames = String(Number(el.dataset.frames || 0) + 1);
    }
    camSend({ ack: id }); // 画完才放下一帧
  })();
}

function mountStream(el) {
  if (!el.dataset.src) return;
  el.dataset.mounted = '1';
  el.dataset.since = String(Date.now()); // 第一次出帧的宽限期从这一刻算
  el.dataset.frames = '0';
  el.dataset.blind = '0';
  streamWatch.delete(el.dataset.cam); // 新订阅重新计时
  streamOf.set(el, { cam: el.dataset.cam });
  camSyncSubs();
}

// 这一路卡住了: 让服务端重挂一份 (会先把缓存的最新一帧推过来)。
function kickStream(el) {
  const id = el.dataset.cam;
  if (!id) return;
  el.dataset.since = String(Date.now());
  el.dataset.frames = '0';
  if (!camSend({ kick: id })) camSyncSubs(); // 通道断了: 先把连接接回来
}

const imgBitmaps = typeof createImageBitmap === 'function';

async function drawFrame(el, jpg) {
  const blob = new Blob([jpg], { type: 'image/jpeg' });
  try {
    if (imgBitmaps) {
      const bmp = await createImageBitmap(blob);
      if (el.width !== bmp.width || el.height !== bmp.height) {
        el.width = bmp.width;
        el.height = bmp.height;
      }
      el.getContext('2d').drawImage(bmp, 0, 0);
      bmp.close();
      return;
    }
    // 老 Safari 没有 createImageBitmap: 退回收到的 Image 对象
    const url = URL.createObjectURL(blob);
    const im = new Image();
    await new Promise((ok, no) => { im.onload = ok; im.onerror = no; im.src = url; });
    if (el.width !== im.naturalWidth || el.height !== im.naturalHeight) {
      el.width = im.naturalWidth;
      el.height = im.naturalHeight;
    }
    el.getContext('2d').drawImage(im, 0, 0);
    URL.revokeObjectURL(url);
  } catch (_) { /* 坏帧跳过 */ }
}

function unmountStream(el) {
  el.dataset.mounted = '0'; // 让待执行的重挂/重试自己放弃
  if (!streamOf.delete(el)) return;
  camSyncSubs();
}

function attachStream(img) {
  mountStream(img);
}

/* 锁屏/切后台再回来: iOS 会把画面连接全掐掉, 回前台重挂一遍,
   顺手把断掉的 WebSocket 也接回来 (主数据和画面各一条)。
   先等 400ms 让系统把旧连接收掉, 别在过渡期里抢名额。 */
function remountAll() {
  for (const el of document.querySelectorAll('canvas.cstream, audio.camaudio')) {
    if (!el.isConnected) continue;
    if (el.tagName === 'AUDIO') unmountAudio(el);
    else unmountStream(el);
  }
  dropCamSocket();
  setTimeout(() => {
    syncWalls();
    syncCameras();
    for (const img of document.querySelectorAll('#zoom canvas[data-src]')) {
      attachStream(img);
    }
  }, 400);
}

// 干净地放掉画面通道 (切后台时用; 前台挂载时会自己重连)。
function dropCamSocket() {
  const sock = camWS;
  camWS = null;
  camSubs = new Set();
  camBackoff = 0;
  camPingAt = 0;
  try { sock && sock.close(); } catch (_) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') {
    /* 切后台/锁屏时主动断流。iOS 会把页面冻住, 连接既不再读也关不掉;
       服务端 6s 后回收名额, 但那条 TCP 一直是 ESTABLISHED —— 手机经
       Cloudflare 隧道来时, 边缘那条流也跟着挂死, 连接级流控窗口被吃光,
       回来以后所有画面一起黑 (反馈 2026-10-26)。这里干净地关掉,
       隧道那头立刻结束, 前台再按 remountAll 重挂。 */
    for (const el of document.querySelectorAll('canvas.cstream, audio.camaudio')) {
      if (!el.isConnected) continue;
      if (el.tagName === 'AUDIO') unmountAudio(el);
      else unmountStream(el);
    }
    dropCamSocket();
    return;
  }
  remountAll();
  if (!ws || ws.readyState > WebSocket.OPEN) {
    try { ws && ws.close(); } catch (_) {}
    ws = null;
    connect();
  }
});
window.addEventListener('pageshow', remountAll);

/* 画面声音: RTSP 摄像头单独一路 MP3, 用 <audio> 播。
   手机浏览器不许无声开场自动播, 第一次点屏幕时补一次 play()。 */
function mountAudio(a) {
  const base = a.dataset.src;
  if (!base || cameraMuted) { unmountAudio(a); return; }
  if (!a.hasAttribute('src')) {
    // 转码进程退出/网络断了: <audio> 只会静静地停住, 5 秒后重新请求。
    a.onerror = a.onended = () => {
      setTimeout(() => {
        if (!a.isConnected || cameraMuted) return;
        unmountAudio(a);
        mountAudio(a);
      }, 5000);
    };
    a.src = base + (base.includes('?') ? '&' : '?') + 'v=' + Date.now();
    a.load();
  }
  a.play().catch(() => { /* 等用户第一次触摸 */ });
}
function unmountAudio(a) {
  if (!a.hasAttribute('src')) return;
  try { a.pause(); } catch (_) {}
  a.removeAttribute('src');
  a.load();
}
['pointerdown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => {
  if (cameraMuted) return;
  for (const a of document.querySelectorAll('audio.camaudio[src]')) {
    if (a.paused) a.play().catch(() => {});
  }
}, true));

/* 服务端每出一帧就加 1; 12 秒没变化说明这条流卡死了, 重挂连接。
   (Mac 那边的 relay 也会在 10 秒无帧时自己重启 ffmpeg, 页面这一层
   管的是浏览器到 Mac 之间那段断了没人发现的情况。) */
/* 画面「黑了但连接看着还在」: 挂上去 8 秒还没画出过一帧 (data-frames 仍是
   0), 说明这条流根本没在出数据。iOS 锁屏回来最典型: 服务端帧号照走,
   浏览器却一条数据都收不到 —— 帧号看门狗完全判不出来, 只能看客户端自己。
   连续失败逐次拉长间隔 (8/16/24… 封顶 60 秒), 出帧后清零。 */
function checkBlindStreams() {
  if (document.visibilityState !== 'visible') return;
  const now = Date.now();
  // 通道本身断了 (还没到重连的时候): 先接回来, 不看单路。
  if (!camWS || camWS.readyState !== WebSocket.OPEN) {
    if (camWant().size) camSyncSubs();
    return;
  }
  for (const img of document.querySelectorAll('canvas[data-cam][data-mounted="1"]')) {
    if (!img.isConnected) continue;
    if (Number(img.dataset.frames || 0) > 0) { img.dataset.blind = '0'; continue; }
    const tries = Number(img.dataset.blind || 0);
    const wait = Math.min(60000, 8000 * (tries + 1));
    if (now - Number(img.dataset.since || now) < wait) continue;
    img.dataset.blind = String(tries + 1);
    kickStream(img);
  }
}
setInterval(checkBlindStreams, 2000);

const streamWatch = new Map();
function checkStalls() {
  // 帧号是 WS 推来的。WS 被 iOS 挂起/掐掉之后 lastCameras 不再更新, 再拿
  // 旧帧号判断「卡住」就会每 12 秒白重挂一次 —— 每次重挂都要新连接, 半死
  // 连接很快把 iOS 的并发名额耗光, 画面反而彻底出不来。WS 静默就不判。
  if (Date.now() - lastMsgAt > 25000) return;
  const now = Date.now();
  for (const img of document.querySelectorAll(
      '#camwall canvas[data-cam], #cameras canvas[data-cam], #zoom canvas[data-cam]')) {
    if (!streamOf.has(img)) continue;
    const c = byCam(img.dataset.cam);
    if (!c) continue;
    const rec = streamWatch.get(c.id) || { seq: -1, movedAt: now };
    if (c.seq !== rec.seq) {
      rec.seq = c.seq;
      rec.movedAt = now;
    }
    if (c.seq > 0 && now - rec.movedAt > 12000) {
      // 有帧号但 12 秒没动 = 这条流卡死了。
      rec.movedAt = now;
      kickStream(img);
    } else if (c.seq === 0 &&
        now - Number(img.dataset.since || now) > 20000) {
      // 服务端从来没出过一帧 (打印机离线 / 源还没就绪): 重挂一次, 让服务端
      // 重新解析源。服务端自己也每 5 秒重试, 这里是双保险。
      kickStream(img);
    }
    streamWatch.set(c.id, rec);
  }
  checkAudioStalls(now);
}

/* 声音死得更安静: RTSP 转码卡住时 <audio> 既不出错也不 ended, 只是不再
   前进。看 currentTime 有没有在走, 15 秒不动就换一条 (iOS 上尤其常见)。 */
const audioWatch = new Map();
function checkAudioStalls(now) {
  if (cameraMuted) return;
  const seen = new Set();
  for (const a of document.querySelectorAll('audio.camaudio[src]')) {
    const id = a.dataset.cam;
    seen.add(id);
    if (a.paused) continue; // 自动播放还没被允许, 等用户点一下
    const rec = audioWatch.get(id) || { t: -1, movedAt: now };
    if (Math.abs(a.currentTime - rec.t) > 0.05) {
      rec.t = a.currentTime;
      rec.movedAt = now;
    } else if (now - rec.movedAt > 15000) {
      rec.movedAt = now;
      unmountAudio(a);
      mountAudio(a);
    }
    audioWatch.set(id, rec);
  }
  for (const id of [...audioWatch.keys()]) {
    if (!seen.has(id)) audioWatch.delete(id);
  }
}

/* 画面通道保活: iOS 把页面挂起 (锁屏/切后台回来) 时 WebSocket 会被静默
   冻住 —— readyState 还是 OPEN, 但一个字节都过不来, 也不触发 close。
   有帧在走就说明活着; 闲的时候每 10 秒发一个 ping, 20 秒收不到任何回音
   就换一条连接。 */
setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  if (!camWS || camWS.readyState !== WebSocket.OPEN) {
    if (camWant().size) camSyncSubs();
    return;
  }
  if (camPingAt && Date.now() - camPingAt > 20000) {
    dropCamSocket();
    camSyncSubs();
    return;
  }
  if (!camPingAt) {
    camPingAt = Date.now();
    camSend({ ping: 1 });
  }
}, 10000);

// 只重拉一台摄像头的画面 (换码流后服务端已经放掉旧 relay)。
function reloadStream(camId) {
  for (const img of document.querySelectorAll(`canvas[data-cam="${CSS.escape(camId)}"]`)) {
    if (img.closest('#zoom')) continue;
    unmountStream(img);
  }
  syncWalls();
  syncCameras();
}

/* 静音 / 码流 / 翻转旋转 / 云台 */

let cameraMuted = false;

// 这些字段每次推送都可能变, 直接改现有 DOM, 不触发重建。
function paintCam() {
  for (const chip of document.querySelectorAll('[data-cam-act="quality"]')) {
    const c = byCam(chip.dataset.cam);
    const label = c && c.quality === 'sub' ? '子码流' : '主码流';
    if (chip.textContent !== label) chip.textContent = label;
  }
  for (const chip of document.querySelectorAll('[data-cam-act="mute"]')) {
    // 每秒重写 innerHTML 会在手指按下时换掉图标, 值没变就跳过。
    const state = cameraMuted ? '1' : '0';
    chip.classList.toggle('on', cameraMuted);
    if (chip.dataset.state === state) continue;
    chip.dataset.state = state;
    chip.innerHTML = cameraMuted ? CAM_ICON.volOff : CAM_ICON.volOn;
    chip.title = cameraMuted ? '开启声音' : '静音';
    chip.setAttribute('aria-pressed', cameraMuted ? 'true' : 'false');
  }
  for (const chip of document.querySelectorAll('[data-cam-act="orient"]')) {
    const c = byCam(chip.dataset.cam);
    chip.classList.toggle('on', !!(c && (c.flipH || c.rotation)));
  }
  for (const img of document.querySelectorAll('canvas[data-cam]')) {
    const c = byCam(img.dataset.cam);
    if (!c) continue;
    // 墙里 16:9 格子装不下转了 90° 的画面 (footprint 竖过来会超高, 被格子
    // overflow:hidden 裁掉近一半): 补一个 9/16 缩小让整幅落回格子。
    // 放大层的 canvas 不在 .camview 里, 走自己的 .rot 高宽互换, 不受影响。
    const rot90 = c.rotation === 90 || c.rotation === 270;
    const wallScale = img.closest('.camview') && rot90 ? ' scale(0.5625)' : '';
    img.style.transform = camTransform(c) + wallScale;
    img.classList.toggle('rot', rot90);
  }
  // 云台盘和画面用同一个变换: 方向键跟着画面一起旋转/翻转。
  for (const pad of document.querySelectorAll('.ptz[data-cam]')) {
    const c = byCam(pad.dataset.cam);
    if (c) pad.style.transform = camTransform(c);
  }
}

async function toggleQuality(c) {
  const next = c.quality === 'sub' ? 'main' : 'sub';
  try {
    const { j } = await post('/api/camera', { camera: c.id, quality: next });
    if (!j.ok) { toast('码流切换失败：' + (j.error || '未知错误'), 'err'); return; }
    c.quality = next;
    paintCam();
    reloadStream(c.id);
    toast(`「${c.name}」已切到${next === 'sub' ? '子' : '主'}码流`, 'ok');
  } catch (e) {
    toast('码流切换请求失败：' + e, 'err');
  }
}

async function toggleMute(c) {
  const next = !cameraMuted;
  try {
    const { j } = await post('/api/camera', { camera: c.id, muted: next });
    if (!j.ok) { toast('声音切换失败：' + (j.error || '未知错误'), 'err'); return; }
    // 静音是全局设置 (和 App 同一个开关), 所有画面一起变。
    cameraMuted = next;
    paintCam();
    syncWalls();
    syncCameras();
    toast(next ? '摄像头已静音' : '摄像头声音已恢复', 'ok');
  } catch (e) {
    toast('声音切换请求失败：' + e, 'err');
  }
}

function openOrient(c) {
  $('modal-title').textContent = `${c.name} · 画面翻转 / 旋转`;
  $('modal-body').innerHTML = `<div class="optlist">
    <button class="opt${c.flipH ? ' on' : ''}" data-orient="flip" data-cam="${esc(c.id)}">
      <span class="tick">${c.flipH ? '✓' : ''}</span>水平翻转</button>
    ${[0, 90, 180, 270].map(d => `<button class="opt${c.rotation === d ? ' on' : ''}"
      data-orient="${d}" data-cam="${esc(c.id)}">
      <span class="tick">${c.rotation === d ? '●' : ''}</span>旋转 ${d === 0 ? '0°(正常)' : d + '°'}</button>`).join('')}
  </div>`;
  $('modal').classList.add('show');
}

async function setOrient(c, value) {
  const body = { camera: c.id };
  if (value === 'flip') body.flipH = !c.flipH;
  else body.rotation = Number(value);
  try {
    const { j } = await post('/api/camera', body);
    if (!j.ok) { toast('画面设置失败：' + (j.error || '未知错误'), 'err'); return; }
    if (body.flipH != null) c.flipH = body.flipH;
    if (body.rotation != null) c.rotation = body.rotation;
    paintCam();
    closeModal();
  } catch (e) {
    toast('画面设置请求失败：' + e, 'err');
  }
}

$('modal-body').addEventListener('click', e => {
  const b = e.target.closest('[data-orient]');
  if (!b) return;
  const c = byCam(b.dataset.cam);
  if (c) setOrient(c, b.dataset.orient);
});

/* 云台: 按住不放连续转, 松手 stop */

const ptzProbed = new Set();
async function probePtz(c) {
  if (ptzProbed.has(c.id)) return;
  ptzProbed.add(c.id);
  for (const pad of document.querySelectorAll(`.ptz[data-cam="${CSS.escape(c.id)}"]`)) {
    pad.classList.add('probing');
    pad.querySelector('.mid').outerHTML = '<div class="spin mid"></div>';
  }
  try {
    const { j } = await post('/api/ptz', { camera: c.id, action: 'probe' });
    setPtzAvailable(c.id, !!j.ok);
  } catch (_) {
    ptzProbed.delete(c.id);
    setPtzAvailable(c.id, false);
  }
}

function setPtzAvailable(camId, ok) {
  for (const pad of document.querySelectorAll(`.ptz[data-cam="${CSS.escape(camId)}"]`)) {
    pad.classList.toggle('unavailable', !ok);
    pad.classList.remove('probing');
    const mid = pad.querySelector('.mid');
    if (mid) mid.outerHTML = `<div class="mid">${CAM_ICON.cam}</div>`;
    pad.title = ok ? '云台' : '云台不可用 - 请确认摄像头支持 ONVIF 或萤石本地服务';
  }
}

let ptzTimer = null, ptzCam = null, ptzDir = null;

async function ptzIssue() {
  if (!ptzCam || !ptzDir) return;
  try {
    const { j } = await post('/api/ptz',
      { camera: ptzCam.id, action: ptzDir, speed: 0.5 });
    if (j.available === false) setPtzAvailable(ptzCam.id, false);
  } catch (_) { /* 松手时的 stop 兜底 */ }
}

function ptzEnd() {
  if (!ptzTimer && !ptzCam) return;
  clearInterval(ptzTimer);
  ptzTimer = null;
  const cam = ptzCam;
  ptzCam = null;
  ptzDir = null;
  if (cam) post('/api/ptz', { camera: cam.id, action: 'stop' }).catch(() => {});
}

document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.ptz button[data-ptz]');
  if (!b) return;
  e.preventDefault();
  const pad = b.closest('.ptz');
  if (pad.classList.contains('unavailable') || pad.classList.contains('probing')) return;
  ptzCam = byCam(pad.dataset.cam);
  if (!ptzCam) return;
  ptzDir = b.dataset.ptz;
  ptzIssue();
  clearInterval(ptzTimer);
  ptzTimer = setInterval(ptzIssue, 250);
}, true);
document.addEventListener('pointerup', ptzEnd, true);
document.addEventListener('pointercancel', ptzEnd, true);
window.addEventListener('blur', ptzEnd);

// 芯片点击 (画面墙和放大视图共用)
document.addEventListener('click', e => {
  const b = e.target.closest('[data-cam-act]');
  if (!b) return;
  const c = byCam(b.dataset.cam);
  if (!c) return;
  const act = b.dataset.camAct;
  if (act === 'quality') toggleQuality(c);
  else if (act === 'mute') toggleMute(c);
  else if (act === 'orient') openOrient(c);
});

/* 画面放大 */
function zoomOn(camId) {
  const c = byCam(camId);
  if (!c || !c.stream) return;
  const z = $('zoom');
  z.innerHTML = `<canvas class="shot" aria-label="${esc(c.name)}" data-cam="${esc(c.id)}"
      data-src="${esc(c.stream)}" style="transform:${camTransform(c)}">
    </canvas>${camChipsHtml(c)}${camPadHtml(c)}`;
  const img = z.querySelector('canvas');
  z.classList.add('show');
  mountStream(img);
  // 墙上/列表里那台先摘掉 (见 zoomedCam), 手机上声音也跟着放大这台走。
  syncWalls();
  syncCameras();
  paintCam();
  if (c.ptz) probePtz(c);
}
function closeZoom() {
  const z = $('zoom');
  z.classList.remove('show');
  z.innerHTML = '';
  // 放大关掉, 墙上那张挂回来。
  syncWalls();
  syncCameras();
}
$('zoom').addEventListener('click', e => {
  // 只点背景或画面本身才关; 点控制按钮不关。
  if (e.target === $('zoom') || e.target.tagName === 'CANVAS') closeZoom();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('zoom').classList.contains('show')) closeZoom();
});
// iOS Safari 的双指捏合放大的是**整个页面**, fixed 的放大层会跟视觉视口
// 错位, 画面被截成一块。放大层开着时拦掉页面捏合 —— 想看细节点墙里格子
// 进放大层就是最大尺寸; 点背景或画面退出。
document.addEventListener('gesturestart', e => {
  if ($('zoom').classList.contains('show')) e.preventDefault();
});

/* ---------------- 控制动作 ---------------- */

async function post(path, body) {
  const r = await fetch(api(path), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  let j = {};
  try { j = await r.json(); } catch (_) {}
  return { r, j };
}

async function sendAction(id, act) {
  const p = byId(id) || { name: id };
  const label = act === 'pause' ? '暂停' : act === 'resume' ? '恢复'
    : act === 'stop' ? '停止' : '换盘';
  if (act === 'stop' && !confirm(`停止「${p.name}」的打印？\n\n已打印部分无法恢复。`)) return;
  if (act === 'plate-swap' &&
      !confirm(`对「${p.name}」一键换盘？\n\n热床会快速震动甩下成品并把打印板推出，` +
               `请确保打印机前方留空。`)) return;
  pending.set(id, label);
  renderRail(lastPrinters);
  renderPane();
  toast(`${label}已发出，等待结果…`, '');
  const t0 = Date.now();
  const path = act === 'plate-swap' ? '/api/plate-swap' : '/api/control';
  const body = act === 'plate-swap' ? { printer: id } : { printer: id, command: act };
  try {
    const { j } = await post(path, body);
    const secs = ((Date.now() - t0) / 1000).toFixed(1);
    if (j.ok) toast(`「${j.printer || p.name}」${label}成功 (${secs}s)`, 'ok');
    else toast(`${label}失败：${j.error || '未知错误'}`, 'err');
  } catch (e) {
    toast(`${label}请求失败：${e}`, 'err');
  } finally {
    pending.delete(id);
    renderRail(lastPrinters);
    renderPane();
  }
}

async function setOn(id, body, label) {
  pending.set(id, label);
  renderRail(lastPrinters);
  renderPane();
  try {
    const { j } = await post('/api/set', { printer: id, ...body });
    if (!j.ok) toast(`${label}失败：${j.error || '未知错误'}`, 'err');
    // 打印机收下命令不等于改了档: 固件常常只在打印中才接受调速,
    // 这时候如实告诉用户, 别让按钮看起来「点成功了」。
    else if (j.note) toast(j.note, '');
  } catch (e) {
    toast(`${label}请求失败：${e}`, 'err');
  } finally {
    pending.delete(id);
    renderRail(lastPrinters);
    renderPane();
  }
}

// 右栏控制 (事件委托: 骨架重建后仍有效)。
$('pane').addEventListener('click', e => {
  const p = selected();
  if (!p) return;
  const b = e.target.closest('button[data-act]');
  if (b && !b.hidden) { sendAction(p.id, b.dataset.act); return; }
  const sb = e.target.closest('button[data-speed]');
  if (sb) { setOn(p.id, { speed: Number(sb.dataset.speed) }, '速度'); return; }
  const lamp = e.target.closest('#lamp');
  if (lamp && !lamp.disabled) {
    setOn(p.id, { light: !(p.state && p.state.light) }, '腔灯');
  }
});

/* ---------------- 视角切换 / 摄像头视角 ---------------- */

document.querySelector('.seg').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b || b.classList.contains('on')) return;
  document.body.dataset.tab = b.dataset.tab;
  for (const x of document.querySelectorAll('.seg button')) {
    const on = x === b;
    x.classList.toggle('on', on);
    x.setAttribute('aria-selected', on ? 'true' : 'false');
  }
  if (b.dataset.tab === 'printers') {
    document.body.dataset.view = 'list';
    renderPane();
  }
  syncCameras();
  syncWalls();
  window.scrollTo({ top: 0 });
});

// 状态每秒推一次, 但摄像头 <img> 不能跟着重建 —— 重建就等于每秒重连一次
// MJPEG 流。只有列表本身变了才重画。
let camSig = null;
function renderCameras(list) {
  const el = $('cameras');
  $('h-cameras').textContent = '摄像头' + (list.length ? ` (${list.length})` : '');
  const sig = list.map(camSigOf).join('#');
  if (sig === camSig) return;
  camSig = sig;
  dropStreams(el);
  if (!list.length) {
    el.innerHTML = '<div class="empty"><b>还没有摄像头</b><span>在 Mac 的 BambuDeck 里添加摄像头</span></div>';
    return;
  }
  el.innerHTML = '';
  for (const c of list) {
    el.appendChild(camCard(c));
    if (c.ptz) probePtz(c);
  }
  syncCameras();
  paintCam();
}

// 切到摄像头才挂 MJPEG, 切走就摘掉 —— 不为看不见的画面占着三条流。
function syncCameras() {
  const on = document.body.dataset.tab === 'cameras';
  const zc = zoomedCam();
  for (const img of document.querySelectorAll('#cameras canvas')) {
    const near = trackNear(img);
    if (on && near && !(zc && img.dataset.cam === zc)) attachStream(img);
    else unmountStream(img);
  }
  syncAudio(document.querySelectorAll('#cameras audio.camaudio'), on);
}

/* ---------------- 提示条 / 数据推送 ---------------- */

let toastTimer;
function toast(msg, kind) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show' + (kind ? ' ' + kind : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, kind === 'err' ? 6000 : 3500);
}

// 手指按下时不重建 DOM (否则按钮可能在下标和上标之间被换掉), 抬起后补一次。
let pointerDown = false;
let dirty = false;
document.addEventListener('pointerdown', () => { pointerDown = true; }, true);
document.addEventListener('pointerup', () => {
  pointerDown = false;
  if (dirty) { dirty = false; renderAll(); }
}, true);
document.addEventListener('pointercancel', () => { pointerDown = false; }, true);

function renderAll() {
  if (pointerDown) { dirty = true; return; }
  renderRail(lastPrinters);
  renderPane();
}

function apply(data) {
  lastPrinters = data.printers || [];
  lastCameras = data.cameras || [];
  const wasMuted = cameraMuted;
  cameraMuted = data.cameraMuted === true;
  if (wasMuted !== cameraMuted) {
    syncWalls();
    syncCameras();
  }
  renderAll();
  renderCameras(lastCameras);
  // 翻转/旋转/静音/码流/云台状态每秒都可能变, 但只改现有 DOM —— 重画
  // 摄像头卡片会把每条 MJPEG 流都断开重连。
  paintCam();
  checkStalls();
  $('clock').textContent = '更新 ' + new Date().toLocaleTimeString('zh-CN');
}

let ws = null;
let lastMsgAt = Date.now();
let wsRetry = 1000;
let wsEverOpen = false;
function connect() {
  if (!TOKEN) return;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const sock = new WebSocket(
      `${proto}://${location.host}/ws?token=${encodeURIComponent(TOKEN)}`);
  ws = sock;
  sock.onopen = () => {
    lastMsgAt = Date.now();
    const c = $('conn');
    c.className = 'conn ok';
    c.querySelector('.txt').textContent = '已连接';
    // 断线这段时间画面/声音多半已经死在半路 (socket 还在, 数据早没了):
    // 接回来就整片重挂一遍, 不用退出重进。
    if (wsEverOpen) remountAll();
    wsEverOpen = true;
    wsRetry = 1000;
  };
  sock.onmessage = e => {
    if (ws !== sock) return;
    lastMsgAt = Date.now();
    try { apply(JSON.parse(e.data)); } catch (_) {}
  };
  sock.onclose = sock.onerror = () => {
    // onerror 后面往往还跟一个 onclose; 旧 socket 的收尾不能再排一次重连。
    if (ws !== sock) return;
    ws = null;
    const c = $('conn');
    c.className = 'conn bad';
    c.querySelector('.txt').textContent = '已断开，重连中…';
    setTimeout(() => { if (!ws) connect(); }, wsRetry);
    wsRetry = Math.min(wsRetry * 2, 10000); // 网络没回来时别每 3 秒猛撞
  };
}
// 换 Wi-Fi / 从飞行模式回来: 立刻重连, 不等退避。
window.addEventListener('online', () => {
  if (ws && ws.readyState <= WebSocket.OPEN) return;
  try { ws && ws.close(); } catch (_) {}
  ws = null;
  wsRetry = 1000;
  connect();
});

// 服务端每 10 秒推一次心跳, 20 秒什么都没收到说明这条连接已经死了
// (锁屏、换 Wi-Fi 之后很常见) —— 自己重连, 不用回列表再进来。
setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  if (Date.now() - lastMsgAt < 20000) return;
  lastMsgAt = Date.now();
  try { ws && ws.close(); } catch (_) {}
  ws = null;
  connect();
}, 5000);

async function boot() {
  try {
    const r = await fetch(api('/api/state'));
    if (r.status === 401) {
      localStorage.removeItem('hubToken');
      TOKEN = '';
      $('gate').classList.remove('hidden');
      return;
    }
    apply(await r.json());
  } catch (_) { /* ws 重连会给出连接状态 */ }
  if (!ws) connect();
  refreshSvc();
}

// ---- 服务状态 (2026-10-27): hub / helper / cloudflared / 隧道 四项自检。
// 30 秒一查 (页面可见时), 芯片给总览红绿, 点击弹四项详情。
let svcData = null;
let svcModalOpen = false;
const SVC_LABELS = {
  hub: '网页服务', helper: '控制 helper',
  cloudflared: 'cloudflared 进程', tunnel: '隧道 bambu.miller.ink',
};
async function refreshSvc() {
  if (document.visibilityState !== 'visible') return;
  try {
    const r = await fetch(api('/api/health'));
    if (!r.ok) return;
    svcData = await r.json();
    renderSvc();
  } catch (_) {}
}
function svcCls(ok) { return ok === true ? 'ok' : ok === false ? 'bad' : 'warn'; }
function fmtUp(sec) {
  if (sec < 90) return sec + ' 秒';
  if (sec < 5400) return Math.round(sec / 60) + ' 分钟';
  return (sec / 3600).toFixed(1) + ' 小时';
}
function svcText(k, s) {
  if (k === 'hub') {
    if (!s) return '未知';
    const up = s.uptimeSec ? ' · 已运行 ' + fmtUp(s.uptimeSec) : '';
    return '运行中' + up;
  }
  if (!s) return '未知';
  switch (s.detail) {
    case 'online': return '在线 (127.0.0.1:8799)';
    case 'no_response': return '无响应(没在跑或端口不通)';
    case 'running': return '进程运行中';
    case 'stopped': return '进程未运行(反复重启起不来, 查 launchd 日志)';
    case 'unknown': return '无法探测(非 macOS 或缺少 pgrep)';
    case 'not_configured': return '未配置探测地址';
    case 'unreachable': return '无响应(DNS/网络异常或隧道断开)';
    default:
      if (String(s.detail).startsWith('http_')) {
        const code = String(s.detail).slice(5);
        return s.ok ? 'HTTP ' + code + ' · 隧道全链路通'
                    : 'HTTP ' + code + '(Cloudflare 报隧道不可达 → 查本机 cloudflared)';
      }
      return String(s.detail);
  }
}
function renderSvc() {
  if (!svcData) return;
  const keys = Object.keys(SVC_LABELS);
  const down = keys.filter(k => svcData[k] && svcData[k].ok === false);
  const chip = $('svc');
  chip.classList.remove('ok', 'bad');
  chip.classList.add(down.length ? 'bad' : 'ok');
  chip.title = down.length
    ? '服务异常: ' + down.map(k => SVC_LABELS[k]).join('、')
    : '服务全部正常';
  if (svcModalOpen) renderSvcModal();
}
function openSvcModal() {
  svcModalOpen = true;
  $('modal-title').textContent = '服务状态';
  renderSvcModal();
  $('modal').classList.add('show');
}
function renderSvcModal() {
  const rows = Object.keys(SVC_LABELS).map(k => {
    const s = svcData && svcData[k];
    const cls = svcCls(s && s.ok);
    return `<div class="svc-row ${cls}"><i></i><span class="k">${SVC_LABELS[k]}</span>` +
      `<span class="v">${esc(svcText(k, s))}</span></div>`;
  }).join('');
  const head = svcData
    ? `<div class="svc-checked">检查于 ${new Date().toLocaleTimeString()} · ` +
      `<a href="#" id="svc-retry">重新检查</a></div>`
    : '<div class="svc-checked">正在检查…</div>';
  $('modal-body').innerHTML = head + rows;
  const retry = $('svc-retry');
  if (retry) retry.addEventListener('click', e => {
    e.preventDefault();
    refreshSvc();
  });
}
$('svc').addEventListener('click', openSvcModal);
setInterval(refreshSvc, 30000);
/* iPhone 壳 (DeckShell) 会注入 deckServer 消息桥。只有桥在的时候才露出
   齿轮 —— 浏览器和 Mac App 没有这个桥, 改服务器地址走 App 自己的设置。 */
(function () {
  const btn = $('srv');
  const bridge = window.webkit && window.webkit.messageHandlers
    && window.webkit.messageHandlers.deckServer;
  if (!btn || !bridge) return;
  btn.classList.add('on');
  btn.addEventListener('click', () => {
    try { bridge.postMessage('open'); } catch (_) {}
  });
})();

if (TOKEN) boot();
</script>
