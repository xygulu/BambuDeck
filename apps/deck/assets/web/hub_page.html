<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BambuDeck</title>
<style>
  /* 配色、字号、圆角全部照抄 app 的 DeckColors / buildDeckTheme:
     卡片 14 圆角 + 1px 边框, 控件 10 圆角, 状态色固定。
     布局照 app 的监控页 (MonitorPage): 左栏打印机卡片列表, 右栏选中那台
     的 控制 + AMS + 摄像头墙; 窄屏退化成卡片列表, 点开进详情 (对应 app 的
     push DashboardPage)。 */
  :root {
    --bg: #0E1216; --surface: #161B21; --card: #1A2027; --border: #262E37;
    --text: #E6E9EE; --text2: #8B94A3;
    --running: #4ADE80; --finish: #34D399; --prepare: #38BDF8;
    --idle: #94A3B8; --pause: #FBBF24; --error: #EF4444; --warning: #F59E0B;
    --on-accent: #062012;
    --head: calc(56px + env(safe-area-inset-top, 0px));
    --rail: 330px;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Segoe UI", "Helvetica Neue", sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  /* 顶栏 = app 的 AppBar: 标题 + 视角切换 (打印机/摄像头) + 连接状态。 */
  header {
    position: sticky; top: 0; z-index: 8;
    display: flex; align-items: center; gap: 14px;
    height: var(--head);
    padding: env(safe-area-inset-top, 0px)
             max(18px, env(safe-area-inset-right)) 0
             max(18px, env(safe-area-inset-left));
    background: rgba(14, 18, 22, .92);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: .2px; }

  .seg {
    display: flex; gap: 2px; padding: 3px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; flex: none;
  }
  .seg button {
    display: flex; align-items: center; gap: 6px;
    border: 0; border-radius: 999px; background: transparent; color: var(--text2);
    font: inherit; font-size: 12px; font-weight: 600;
    padding: 5px 14px; cursor: pointer; white-space: nowrap;
  }
  .seg button.on { background: rgba(74, 222, 128, .14); color: var(--running); }
  .seg svg { width: 14px; height: 14px; }

  /* 服务器地址/令牌入口, 挨着连接状态放在它左边。只有 iPhone 壳里能用
     (壳注入了 deckServer 消息桥, 见文件末尾); 浏览器和 Mac App 的设置
     在 App 自己那儿, 这里隐藏。 */
  .srv {
    display: none; margin-left: auto; flex: 0 0 auto;
    width: 28px; height: 28px; padding: 0; border: 0; border-radius: 8px;
    background: transparent; color: var(--text2); cursor: pointer;
    align-items: center; justify-content: center;
  }
  .srv.on { display: inline-flex; }
  .srv:hover, .srv:active { background: rgba(255, 255, 255, .07); color: var(--text); }
  .srv:focus-visible { outline: 2px solid var(--running); outline-offset: 1px; }
  .srv svg { width: 17px; height: 17px; }
  /* 齿轮出现时由它撑开左侧空隙, 连接状态不用自己再顶到右边。 */
  .srv.on + .conn { margin-left: 0; }

  .conn {
    margin-left: auto; display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text2); white-space: nowrap;
  }
  .conn i { width: 7px; height: 7px; border-radius: 50%; background: var(--text2); }
  .conn.ok i { background: var(--running); }
  .conn.bad i { background: var(--error); }
  #clock { font-size: 12px; color: var(--text2); font-variant-numeric: tabular-nums; }

  /* 服务状态 chip (2026-10-27): 与 .conn 同款圆点语言, 点击看四项详情。 */
  .svc {
    display: flex; align-items: center; gap: 6px;
    border: 0; background: transparent; color: var(--text2);
    font: inherit; font-size: 12px; white-space: nowrap; cursor: pointer;
    padding: 4px 6px; border-radius: 8px;
  }
  .svc:hover, .svc:active { background: rgba(255, 255, 255, .07); color: var(--text); }
  .svc i { width: 7px; height: 7px; border-radius: 50%; background: var(--text2); }
  .svc.ok i { background: var(--running); }
  .svc.bad i { background: var(--error); }
  .svc:focus-visible { outline: 2px solid var(--running); outline-offset: 1px; }
  .svc-row {
    display: flex; align-items: baseline; gap: 10px; padding: 9px 2px;
    border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .svc-row:last-child { border-bottom: 0; }
  .svc-row i { width: 8px; height: 8px; border-radius: 50%; background: var(--text2); flex: none; }
  .svc-row.ok i { background: var(--running); }
  .svc-row.bad i { background: var(--error); }
  .svc-row .k { width: 150px; flex: none; color: var(--text); }
  .svc-row .v { color: var(--text2); flex: 1; min-width: 0; }
  .svc-checked { font-size: 12px; color: var(--text2); padding: 2px 2px 10px; }
  .svc-checked a { color: var(--prepare); text-decoration: none; }

  main { max-width: 1600px; margin: 0 auto; }
  section { display: none; }
  body[data-tab="printers"] #s-printers { display: block; }
  body[data-tab="cameras"] #s-cameras { display: block; }
  #s-cameras { padding: 16px; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px;
  }

  /* ---- 打印机视角: 左右两栏 ---- */
  #printers-layout {
    display: grid; grid-template-columns: var(--rail) minmax(0, 1fr);
    height: calc(100dvh - var(--head));
  }

  /* 左栏: 打印机卡片列表 (MonitorPrinterCard) */
  #rail { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .rail-head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px 4px;
  }
  .rail-head b { font-size: 14px; font-weight: 700; }
  #plist {
    flex: 1; overflow-y: auto; padding: 4px 10px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }

  .pcard {
    background: var(--card); border: 1px solid transparent;
    border-radius: 14px; padding: 12px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .pcard:hover { background: #1D242B; }
  .pcard.sel { border-color: rgba(74, 222, 128, .7); }

  .prow { display: flex; align-items: flex-start; gap: 10px; }
  .pident { min-width: 0; flex: 1; }
  .pident .name {
    font-size: 15px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pident .meta { font-size: 12px; color: var(--text2); margin-top: 3px; }
  /* 没收到状态时用连接状态的小圆点, 颜色跟 App 的 _connDot 一致。 */
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--text2); margin-top: 6px; flex: 0 0 auto; }
  .dot.ok   { background: var(--running); }
  .dot.warn { background: var(--warning); }
  .dot.err  { background: var(--error); }

  .badge {
    flex: 0 0 auto; font-size: 13px; font-weight: 600; letter-spacing: .2px;
    padding: 4px 10px; border-radius: 999px;
    border: 1px solid transparent; white-space: nowrap;
  }
  .badge.running { color: var(--running); background: rgba(74,222,128,.14); border-color: rgba(74,222,128,.5); }
  .badge.pause   { color: var(--pause);   background: rgba(251,191,36,.14); border-color: rgba(251,191,36,.5); }
  .badge.prepare { color: var(--prepare); background: rgba(56,189,248,.14); border-color: rgba(56,189,248,.5); }
  .badge.finish  { color: var(--finish);  background: rgba(52,211,153,.14); border-color: rgba(52,211,153,.5); }
  .badge.failed  { color: var(--error);   background: rgba(239,68,68,.14);  border-color: rgba(239,68,68,.5); }
  .badge.idle    { color: var(--idle);    background: rgba(148,163,184,.14); border-color: rgba(148,163,184,.5); }

  .taskrow { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; }
  .task {
    flex: 1; min-width: 0; font-size: 12px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pct { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar {
    height: 3px; border-radius: 2px; margin: 5px 0 6px;
    background: rgba(38, 46, 55, .6); overflow: hidden;
  }
  .bar i { display: block; height: 100%; border-radius: 2px; transition: width .6s; }
  .facts { font-size: 11px; color: var(--text2); margin-top: 4px; font-variant-numeric: tabular-nums; }
  /* App 的步骤行: Icons.timelapse + 绿色文字 */
  .stage {
    display: flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600; color: var(--running); margin-top: 3px;
  }
  .stage svg { width: 11px; height: 11px; flex: 0 0 auto; }
  .door { font-size: 11px; color: var(--warning); margin-top: 4px; }
  /* 报错芯片 = 弹窗入口 (App 里点它打开 HMS 详情)。 */
  .errchip {
    display: inline-flex; align-items: center; gap: 4px;
    margin-top: 6px; padding: 3px 8px; border-radius: 999px;
    font-size: 11px; color: var(--error); cursor: pointer;
    background: rgba(239,68,68,.14); border: 1px solid rgba(239,68,68,.5);
  }
  .errchip:hover { filter: brightness(1.2); }
  .errchip:focus-visible { outline: 2px solid var(--error); outline-offset: 2px; }

  /* 报错详情弹窗 (App 的 showHmsDialog) */
  #modal {
    position: fixed; inset: 0; z-index: 26; background: rgba(0,0,0,.62);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  #modal.show { display: flex; }
  .modal-card {
    width: 100%; max-width: 460px; max-height: 80vh; overflow: auto;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px;
  }
  .modal-card h3 { font-size: 16px; margin-bottom: 12px; }
  /* 边框/标题色按最严重的一条换 (App 的 hmsWorstRank: 0 致命 1 严重 其余一般)。 */
  .hms-box { border-radius: 12px; padding: 12px; --hms: var(--error); }
  .hms-box.fatal   { background: rgba(239,68,68,.10);  border: 1px solid rgba(239,68,68,.55);  --hms: var(--error); }
  .hms-box.serious { background: rgba(245,158,11,.10); border: 1px solid rgba(245,158,11,.55); --hms: var(--warning); }
  .hms-box.common  { background: rgba(251,191,36,.10); border: 1px solid rgba(251,191,36,.55); --hms: var(--pause); }
  .hms-head {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; color: var(--hms);
  }
  .hms-entry { margin-top: 6px; }
  .hms-entry .code { font-size: 12px; font-weight: 600; color: var(--hms); opacity: .85; }
  .hms-entry .desc { font-size: 12px; color: var(--text2); }
  .modal-card .btn { margin: 12px 0 0 auto; display: flex; }

  /* 右栏: 选中打印机的详情 */
  #pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .pane-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px 4px; min-height: 40px;
  }
  .pane-head .ptitle { font-size: 16px; font-weight: 700; }
  .phead-main { flex: 1; min-width: 0; }
  /* 窄屏详情页没有左栏卡片, 任务/进度/剩余补到标题下面; 宽屏左栏已经有。 */
  .pjob {
    display: none; margin-top: 3px; font-size: 12px; color: var(--text2);
    font-variant-numeric: tabular-nums;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* 只有模型名会很长: 它自己缩并出 … , 进度/层数/剩余时间固定显示。 */
  .pjob .jname { min-width: 0; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
  .pjob .jsep { flex: 0 0 auto; padding: 0 4px; opacity: .55; }
  .pjob .jnum { flex: 0 0 auto; }
  .pane-head .pnet {
    margin-left: auto; font-size: 12px; color: var(--text2);
    font-variant-numeric: tabular-nums;
  }
  .back {
    display: none; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--text);
    font-size: 17px; line-height: 1;
  }
  .pane-body {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    padding: 6px 16px 12px; gap: 8px;
  }
  .toprow { display: flex; gap: 8px; align-items: stretch; }
  /* 反馈 2026-10-24: 控制卡只要放得下按钮就行, 宽度让给 AMS ——
     料盘要横排 4 格 + 外部料卷, 窄了颜色名全被省略。 */
  .toprow .ctl { flex: 4; min-width: 0; }
  .toprow .amscard { flex: 7; min-width: 0; }

  .ctl { display: flex; flex-direction: column; justify-content: center; gap: 8px; }
  .ctl-title { font-size: 13px; font-weight: 600; }
  .ctl-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  /* 手机上按钮装在 .ctl-scroll 里自己横滑, AMS 芯片固定在行尾 (见 ≤700px)。
     桌面端这层壳不参与布局, 按钮还是直接排在 .ctl-row 里。 */
  .ctl-scroll { display: contents; }
  /* AMS 芯片和弹出层只在手机上出现; 桌面端 AMS 是单独一张卡。 */
  .ams-chip { display: none; }
  .ams-pop { display: none; }
  .lbl { font-size: 12px; color: var(--text2); }
  audio.camaudio { display: none; }
  /* 「速度」跟着分段控件、「灯」跟着开关一起换行, 不拆散。 */
  .ctlgrp { display: inline-flex; align-items: center; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 34px; border: 0; border-radius: 10px; padding: 0 12px;
    font: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: filter .15s, transform .05s;
    background: transparent; color: var(--text);
  }
  .btn svg { width: 16px; height: 16px; }
  .btn.primary { background: rgba(74,222,128,.16); color: var(--running); }
  .btn.danger { background: rgba(239,68,68,.15); color: var(--error); }
  .btn.outline { background: transparent; color: var(--text); border: 1px solid var(--border); height: 32px; font-size: 12px; }
  .btn:hover { filter: brightness(1.15); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .35; cursor: default; filter: none; transform: none; }
  .btn.icon { width: 34px; padding: 0; }

  /* 速度分段 (SegmentedButton) */
  .speed {
    display: inline-flex; padding: 2px; gap: 1px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  }
  .speed button {
    border: 0; background: transparent; color: var(--text2);
    font: inherit; font-size: 11px; font-weight: 600;
    padding: 4px 9px; border-radius: 6px; cursor: pointer;
  }
  .speed button.on { background: rgba(74,222,128,.18); color: var(--running); }
  .speed button:disabled { opacity: .35; cursor: default; }

  /* 腔灯就是一个图标按钮: 点一下开关, 亮的时候琥珀色、灭的时候灰。 */
  .lamp { color: var(--text2); }
  .lamp.on { color: #FFC107; background: rgba(255,193,7,.14); }
  .lamp svg { width: 17px; height: 17px; }
  /* 灯的按钮外框和速度分段控件一样高。 */
  .btn.icon.lamp { height: 31px; }

  /* AMS 卡 */
  .amscard { display: flex; align-items: center; }
  .ams-row { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
  .ams-unit {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 10px;
  }
  .ams-unit .uh { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .ams-unit .uh b { font-size: 12px; font-weight: 600; }
  .hum { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; color: var(--text2); }
  .hum i { width: 7px; height: 7px; border-radius: 50%; }
  .dry { font-size: 10px; color: var(--warning); background: rgba(245,158,11,.15); border-radius: 6px; padding: 1px 6px; }
  .trays { display: flex; gap: 6px; }
  .tray { position: relative; display: flex; flex-direction: column; align-items: center; width: 56px; }
  .tray .c {
    position: relative; width: 34px; height: 34px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.7);
  }
  .tray.active .c { border: 3.5px solid var(--running); }
  .tray .flow {
    position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
    width: 24px; height: 14px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.82); border-radius: 6px;
    font-size: 9px; font-weight: 700; color: #0E1216; letter-spacing: .3px;
  }
  .tray .play {
    position: absolute; right: -2px; bottom: -2px; width: 14px; height: 14px;
    border-radius: 50%; background: var(--running); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 9px;
  }
  .tray .t {
    font-size: 10px; font-weight: 600; margin-top: 3px;
    max-width: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tray .p { font-size: 10px; color: var(--text2); }
  .ams-none { font-size: 13px; color: var(--text2); }

  /* 摄像头墙 (右栏下半 / CameraWallSection) */
  .wall {
    flex: 1; min-height: 0; overflow-y: auto;
    display: grid; gap: 10px; align-content: start;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  }
  .wall .cam { padding: 10px; }
  .camview {
    position: relative; margin-top: 8px; border-radius: 10px; overflow: hidden;
    background: #000;
  }
  .camview .shot {
    display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain;
    background: #000; cursor: zoom-in; transition: transform .18s;
  }
  .wall .off, .cam .off {
    width: 100%; aspect-ratio: 16 / 9; background: #000;
    border-radius: 10px; margin-top: 8px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text2); font-size: 12px;
  }
  .wall-empty {
    grid-column: 1 / -1; padding: 26px 12px; text-align: center;
    color: var(--text2); font-size: 13px;
  }

  /* CameraTile 的悬浮控制: 右上 码流/静音/翻转旋转, 右下 云台 */
  .camchips {
    position: absolute; right: 8px; top: 8px;
    display: flex; gap: 6px; align-items: center;
  }
  .chip {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    height: 26px; padding: 0 8px; border: 0; border-radius: 10px;
    background: rgba(0,0,0,.55); color: #fff;
    font: inherit; font-size: 11px; cursor: pointer;
  }
  .chip.icon { width: 26px; padding: 0; }
  .chip svg { width: 14px; height: 14px; }
  .chip:hover { filter: brightness(1.3); }
  .chip.on { color: var(--pause); }
  .ptz {
    position: absolute; right: 8px; bottom: 8px; width: 96px; height: 96px;
    border-radius: 50%; background: rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
    transition: opacity .15s; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .ptz.unavailable { opacity: .45; }
  .ptz .mid { width: 18px; height: 18px; color: rgba(255,255,255,.7); }
  .ptz .spin {
    width: 16px; height: 16px; border-width: 2px;
    border-color: rgba(255,255,255,.25); border-top-color: #fff;
  }
  .ptz button {
    position: absolute; width: 30px; height: 30px; padding: 0;
    border: 0; border-radius: 50%; background: rgba(0,0,0,.35); color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; touch-action: none;
  }
  .ptz button:hover { background: rgba(0,0,0,.55); }
  .ptz button svg { width: 18px; height: 18px; }
  .ptz .up    { top: 3px;    left: 50%; margin-left: -15px; }
  .ptz .down  { bottom: 3px; left: 50%; margin-left: -15px; }
  .ptz .left  { left: 3px;   top: 50%;  margin-top: -15px; }
  .ptz .right { right: 3px;  top: 50%;  margin-top: -15px; }

  /* 画面翻转 / 旋转的选择面板 (App 的 _orientationMenu) */
  .optlist { display: flex; flex-direction: column; gap: 6px; }
  .opt {
    display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 10px; background: transparent;
    color: var(--text); font: inherit; font-size: 13px; cursor: pointer; text-align: left;
  }
  .opt:hover { background: #202833; }
  .opt.on { border-color: rgba(74,222,128,.6); color: var(--running); }
  .opt .tick { width: 14px; flex: 0 0 auto; text-align: center; }

  /* 画面放大 */
  #zoom {
    position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.9);
    display: none; align-items: center; justify-content: center;
    /* iPhone 全面屏开了 viewport-fit=cover, 16px 固定内边距会让画面伸到
       Home 指示条/工具栏底下被截 (反馈 2026-10-27: 放大显示不完全)。 */
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px))
             max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    overflow: hidden;
  }
  #zoom.show { display: flex; }
  #zoom .shot {
    max-width: 100%; max-height: 100%; object-fit: contain;
    background: #000; border-radius: 10px; cursor: zoom-out;
  }
  /* 90/270° 时画面绕中心转了 90°, 用视口的高宽互换后再放得下。
     dvh/dvw 跟随 Safari 工具栏收放, 比 vh/vw 更贴近 inset:0 的实际可用区。 */
  #zoom .shot.rot { max-width: calc(100vh - 32px); max-height: calc(100vw - 32px); }
  @supports (height: 100dvh) {
    #zoom .shot.rot { max-width: calc(100dvh - 32px); max-height: calc(100dvw - 32px); }
  }
  /* 手机上墙里的芯片改成 static 排在格子下面; 放大层里没有「下面」,
     必须仍浮在画面右上 —— 不然会变成 flex 兄弟节点把画面挤到一边
     (反馈 2026-10-27: 放大显示不完全)。#zoom 自带 safe-area 内边距,
     这里相对它的 padding box 定位, 别再加 env() 免得双份。 */
  #zoom .camchips { position: absolute; padding: 0; top: 8px; right: 8px; }
  #zoom .camchips .chip { white-space: nowrap; }

  /* 状态占位 */
  .placeholder {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 40px 16px; color: var(--text2); font-size: 13px;
  }
  .spin {
    width: 26px; height: 26px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--running);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 摄像头视角网格 */
  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    align-items: start;
  }
  h2 { font-size: 14px; font-weight: 700; margin: 2px 0 10px; }

  /* 空态 */
  .empty {
    grid-column: 1 / -1;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 56px 16px; color: var(--text2); text-align: center;
  }
  .empty svg { width: 56px; height: 56px; opacity: .55; }
  .empty b { font-size: 16px; font-weight: 500; color: var(--text2); }
  .empty span { font-size: 13px; max-width: 34em; }

  /* 访问令牌 */
  #gate {
    position: fixed; inset: 0; z-index: 30; background: var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  #gate .gate-card {
    width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 10px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 22px;
  }
  #gate h1 { font-size: 20px; }
  #gate p { margin: 0 0 4px; font-size: 13px; color: var(--text2); }
  #gate input {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 12px 14px; font: inherit; font-size: 14px;
    width: 100%; outline: none;
  }
  #gate input:focus { border-color: rgba(74, 222, 128, .6); }
  #gate button {
    background: var(--running); border: 0; color: var(--on-accent);
    border-radius: 10px; padding: 12px; font: inherit; font-size: 14px;
    font-weight: 600; cursor: pointer;
  }

  /* 提示条 (SnackBar) */
  #toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(8px);
    max-width: min(88vw, 520px); padding: 11px 16px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    font-size: 13px; color: var(--text);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
    opacity: 0; pointer-events: none; z-index: 20;
    transition: opacity .18s, transform .18s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.ok { border-color: rgba(74, 222, 128, .5); }
  #toast.err { border-color: rgba(239, 68, 68, .5); }

  .hidden { display: none !important; }
  [hidden] { display: none !important; }

  /* 窄屏 (<1000px): 左栏变卡片网格, 右栏改成点开的详情页 (app 的
     GridView + push DashboardPage)。 */
  @media (max-width: 999px) {
    #printers-layout { display: block; height: auto; }
    #rail { border-right: 0; display: block; }
    #plist {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 10px; overflow: visible; padding: 4px 12px 16px;
    }
    #pane { display: none; padding-bottom: 8px; }
    body[data-view="detail"] #rail { display: none; }
    body[data-view="detail"] #pane { display: flex; }
    body[data-view="detail"] .pjob { display: flex; align-items: baseline; }
    /* 窄屏把 WiFi/IP 折到第二行, 让任务行有整行宽度。 */
    body[data-view="detail"] .pane-head { flex-wrap: wrap; row-gap: 2px; }
    body[data-view="detail"] .pnet {
      flex-basis: 100%; margin-left: 0; text-align: right; font-size: 11px;
    }
    .back { display: inline-flex; }
    .pane-body { padding: 6px 12px 16px; }
    .toprow { flex-direction: column; }
    .wall { overflow: visible; grid-template-columns: 1fr; }
    #s-cameras { padding: 12px; }
    .grid { grid-template-columns: 1fr; gap: 10px; }
  }

  /* 手机: 单列、字号加一档、触控目标 40px 起; 摄像头控制条移到画面下方,
     不再盖住本来就小的画面 (反馈 2026-10-25: iPhone 上「不太适合手机屏幕」)。 */
  @media (max-width: 700px) {
    :root { --head: calc(52px + env(safe-area-inset-top, 0px)); }
    header { gap: 8px; padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
    h1 { font-size: 17px; }
    .seg { padding: 2px; }
    .seg button { padding: 6px 11px; font-size: 12px; gap: 5px; }
    .seg svg { width: 14px; height: 14px; }
    #clock { display: none; }
    .conn { gap: 5px; font-size: 12px; min-width: 0; }
    .conn .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 78px; }
    .conn i { width: 8px; height: 8px; }
    /* 服务 chip 只留状态圆点 (aria-label/title 仍在): 宽度让给视角切换,
       否则整行挤爆、按钮文字换行 (反馈 2026-10-27: iOS 顶部挤到一起)。 */
    .svc { gap: 5px; padding: 4px 5px; }
    .svc .txt { display: none; }
    .srv { width: 26px; height: 26px; }
    .srv svg { width: 16px; height: 16px; }

    /* 列表 */
    .rail-head { padding: 10px 14px 2px; }
    #plist { gap: 10px; padding: 6px 12px 20px; }
    .pcard { padding: 14px; }
    .pident .name { font-size: 17px; }
    .pident .meta { font-size: 13px; margin-top: 4px; }
    .badge { font-size: 13px; padding: 5px 11px; }
    .taskrow { margin-top: 12px; }
    .task, .pct { font-size: 13px; }
    .bar { height: 4px; margin: 6px 0 7px; }
    .facts { font-size: 12px; margin-top: 5px; }
    .stage { font-size: 12px; gap: 5px; margin-top: 4px; }
    .stage svg { width: 13px; height: 13px; }
    .door { font-size: 12px; }
    .errchip { font-size: 12px; padding: 5px 10px; margin-top: 8px; }

    /* 详情 */
    .back { width: 36px; height: 36px; border-radius: 11px; font-size: 17px; }
    /* 详情头部只留一行名字 + 一行任务, 高度让给监控画面。
       名字和模型名都单行, 超长用 … ; 进度/层数/剩余不截。 */
    .pane-head { padding: 6px 12px 0; min-height: 0; gap: 8px; align-items: center; }
    .pane-head .ptitle {
      font-size: 15px; line-height: 1.3;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .pjob {
      margin-top: 2px; font-size: 11px; line-height: 1.35;
      white-space: nowrap; overflow: hidden;
    }
    /* 手机上监控页不显示 WiFi/IP：挤在一行里还抢画面, 想看网络去列表的
       「局域网 · 已连接」。 */
    body[data-view="detail"] .pnet { display: none; }
    .pane-body { padding: 8px 12px 20px; gap: 10px; }
    /* 控制: 压成一行。文字标签收起 (aria-label/title 保留), 速度、灯、换盘
       都缩到 36px 高; 极窄屏横向滑动, 不换行。 */
    .toprow .ctl { padding: 8px 10px; gap: 0; }
    .ctl-title { display: none; }
    .ctl-row {
      flex-wrap: nowrap; gap: 4px; align-items: center;
      width: 100%;
    }
    /* 按钮自己横滑, 右边的 AMS 芯片始终留在行尾, 不会被滑出去。 */
    .ctl-scroll {
      display: flex; gap: 4px; align-items: center;
      flex: 1 1 auto; min-width: 0;
      overflow-x: auto; scrollbar-width: none;
    }
    .ctl-scroll::-webkit-scrollbar { display: none; }
    .ctl-scroll > *, .ctlgrp { flex: 0 0 auto; }
    /* AMS: 只显示当前进料的那一个通道, 点开在芯片旁边弹出全部料盘。 */
    .toprow .amscard { display: none; }
    /* 通道芯片: 色圈在上、编号 (A1F3) 在下, 横向只占一个按钮宽。 */
    .ams-chip {
      display: inline-flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 2px;
      flex: 0 0 auto; height: 36px; min-width: 38px; padding: 0 6px;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--card); color: var(--text);
      font: inherit; font-size: 11.5px; cursor: pointer;
    }
    .ams-chip[hidden] { display: none; }
    .ams-chip .c {
      position: relative; width: 14px; height: 14px; border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .6);
    }
    /* 正在进料/退料时, 色圈右上角挂一个小绿点 + 方向箭头 (和料盘上的一致)。 */
    .ams-chip .play {
      position: absolute; right: -4px; top: -4px;
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--running); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 6px; line-height: 1;
      box-shadow: 0 0 0 1.5px var(--card);
    }
    .ams-chip .t { font-size: 9.5px; font-weight: 700; line-height: 1; letter-spacing: .2px; }
    .ams-pop { position: fixed; inset: 0; z-index: 30; display: none; }
    .ams-pop.open { display: block; }
    .ams-pop-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .38); }
    .ams-pop-card {
      position: fixed; max-height: 62vh; overflow-y: auto;
      padding: 10px; border-radius: 12px;
      background: var(--card); border: 1px solid var(--border);
      box-shadow: 0 14px 34px rgba(0, 0, 0, .5);
    }
    .ams-pop-body .ams-row { gap: 4px 8px; }
    .btn { height: 36px; font-size: 13px; padding: 0 10px; gap: 5px; }
    .btn .btn-txt { display: none; }
    .btn.icon { width: 36px; }
    .btn svg { width: 16px; height: 16px; }
    .btn.outline { height: 36px; padding: 0 11px; }
    .lbl { display: none; }
    .ctlgrp { gap: 6px; }
    .speed { padding: 2px; }
    .speed button { padding: 4px 8px; font-size: 11px; }
    /* 灯: 外框和速度分段控件一样高, 图标大一点更好点。 */
    .btn.icon.lamp { border-radius: 8px; }
    .lamp svg { width: 19px; height: 19px; }

    /* AMS: 每台 AMS 是一个整体, 一行放不下就整台换到下一行
       (AMS1 一行、AMS2 一行), 不横向滑动。只有单台自己都超宽时,
       才在它内部把料盘折行。 */
    .toprow .amscard { padding: 6px 10px; }
    .ams-row {
      flex-wrap: wrap; align-items: center; gap: 4px 8px; width: 100%;
    }
    .ams-unit {
      flex: 0 0 auto; max-width: 100%;
      display: flex; align-items: center; gap: 2px;
      padding: 1px 4px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px;
    }
    /* 空料位只留一个空心圈, 不写「-」; 「外部料卷」只写「外部」。 */
    .tray .t.blank, .uh .rest { display: none; }
    .ams-unit .uh { margin: 0; gap: 2px; flex: 0 0 auto; }
    .ams-unit .uh b { font-size: 10.5px; margin-right: 1px; }
    .hum, .dry { font-size: 9px; }
    .hum { gap: 2px; }
    .hum i { width: 5px; height: 5px; }
    .dry { padding: 0 3px; }
    .trays { gap: 3px; flex-wrap: wrap; }
    .tray { flex-direction: row; align-items: center; gap: 3px; width: auto; }
    .tray .c { width: 11px; height: 11px; border-width: 1px; }
    .tray.active .c { border-width: 2px; }
    .tray .t { margin: 0; font-size: 10px; max-width: 42px; }
    .tray .p { font-size: 9px; }
    .tray .play { width: 9px; height: 9px; font-size: 6px; right: -3px; top: -3px; bottom: auto; }
    /* IN/OUT 从色块里挪出来, 跟在余量后面, 12px 的圆点里塞不下。 */
    .tray .flow {
      position: static; transform: none; width: auto; height: auto;
      background: none; color: var(--running); font-size: 8.5px;
    }
    /* 控制行一行放不下时右边缘渐隐提示还能继续滑, 滑到底由 JS 摘掉 .more。
       AMS 不给这个提示: 它是整台换行, 不横向滑动。 */
    .ctl-scroll.more {
      -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 30px), transparent);
      mask-image: linear-gradient(90deg, #000 calc(100% - 30px), transparent);
    }
    .ams-none { font-size: 13px; }

    /* 摄像头: 控制条 + 云台放到画面下方 (画面 16:9 只有 ~200px 高,
       原来压在上面的按钮和云台盘占掉近一半)。 */
    .cam { padding: 12px; }
    .camview { display: grid; grid-template-columns: 1fr auto; align-items: center; }
    .camview > .shot { grid-column: 1 / -1; }
    .camchips { position: static; grid-column: 1; padding: 8px 0 8px 10px; }
    /* 不能是 static: 四个方向键是 absolute, 得让 .ptz 自己当包含块。 */
    .ptz {
      position: relative; grid-column: 2; width: 108px; height: 108px;
      margin: 4px 8px 4px 0;
    }
    .ptz button { width: 34px; height: 34px; }
    .ptz .up, .ptz .down { margin-left: -17px; }
    .ptz .left, .ptz .right { margin-top: -17px; }
    .ptz .up { top: 4px; } .ptz .down { bottom: 4px; }
    .ptz .left { left: 4px; } .ptz .right { right: 4px; }
    .chip { height: 30px; font-size: 12px; padding: 0 10px; }
    .chip.icon { width: 30px; }
    .chip svg { width: 15px; height: 15px; }
    .wall-empty { font-size: 13.5px; }
    .wall .off, .cam .off { font-size: 13px; }

    /* 摄像头视角 */
    #s-cameras { padding: 10px 12px 20px; }
    h2 { font-size: 15px; }

    /* 弹窗 / 令牌页 / 提示 */
    .modal-card { padding: 16px; }
    .modal-card h3 { font-size: 17px; }
    .hms-entry .code, .hms-entry .desc { font-size: 13px; }
    .opt { min-height: 44px; font-size: 14px; }
    #gate .gate-card { padding: 20px; }
    #gate input { font-size: 16px; padding: 13px 14px; }
    #gate button { font-size: 15px; }
    #toast { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font-size: 13.5px; }
  }
  /* iPhone SE 这类 375px 机器: 标题收一点, 状态文字只留「已连接/重连中」时放得下。 */
  @media (max-width: 380px) {
    header { gap: 6px; }
    h1 { font-size: 16px; }
    .seg button { padding: 6px 9px; font-size: 11.5px; }
    .conn .txt { max-width: 56px; }
  }
  /* ≤440px 的手机竖屏: 标题整体让位 —— 视角切换 + 状态已经是完整的页面标识,
     再挤标题整行超宽、按钮文字被迫换行 (反馈 2026-10-27)。 */
  @media (max-width: 440px) {
    header > h1 { display: none; }
  }
</style>
</head>

  </section>
</main>

<div id="zoom"></div>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-card">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <button class="btn outline" id="modal-close">关闭</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
let TOKEN = localStorage.getItem('hubToken') || '';
const $ = id => document.getElementById(id);

// ?token= 只是设置页 / iOS 壳交一次手的参数: 存进 localStorage 后立刻从
// 地址栏抹掉, 令牌不进浏览历史。
const q = new URLSearchParams(location.search);
if (q.get('token')) {
  TOKEN = q.get('token');
  localStorage.setItem('hubToken', TOKEN);
  q.delete('token');
  const rest = q.toString();
  history.replaceState(null, '', location.pathname + (rest ? '?' + rest : ''));
}
if (!TOKEN) $('gate').classList.remove('hidden');
$('go').onclick = () => {
  TOKEN = $('tok').value.trim();
  if (!TOKEN) { $('tok').focus(); return; }
  localStorage.setItem('hubToken', TOKEN);
  $('gate').classList.add('hidden');
  boot();
};
$('tok').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });

const api = path => path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN);
const esc = s => String(s).replace(/[&<>"]/g, ch =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

// 与 app 的 fmtRemaining / fmtTemp 一致。
const fmtRemaining = m => {
  if (!m || m <= 0) return '0分钟';
  const h = Math.floor(m / 60), mm = m % 60;
  if (h === 0) return mm + '分钟';
  return mm === 0 ? h + '小时' : h + '小时' + mm + '分';
};
// 详情页那行只有一行宽, 剩余时间用紧凑写法: 1h15m / 45m。
const fmtShortRemaining = m => {
  if (!m || m <= 0) return '0m';
  const h = Math.floor(m / 60), mm = m % 60;
  return h ? (mm ? h + 'h' + mm + 'm' : h + 'h') : mm + 'm';
};
// BambuConnStatus → 卡片上的连接文字 (和 App 左栏卡片一样)。
const CONN = {
  connected: ['已连接', 'ok'],
  connecting: ['连接中', 'warn'],
  reconnecting: ['重连中', 'warn'],
  disconnected: ['未连接', 'off'],
  error: ['错误', 'err'],
};
const fmtTemp = (v, t) => {
  const cur = Math.round(v || 0) + '°';
  return t && t > 0 ? cur + '/' + Math.round(t) + '°' : cur;
};

// gcodeStateLabel(zh) + stateColor。
const STATE = {
  RUNNING: ['打印中', 'running'], PREPARE: ['准备中', 'prepare'],
  PAUSE: ['已暂停', 'pause'], FINISH: ['已完成', 'finish'],
  FAILED: ['失败', 'failed'], IDLE: ['空闲', 'idle'],
  UNKNOWN: ['未知', 'idle'], OTHER: ['其他', 'idle'],
};
const COLOR = {
  running: 'var(--running)', prepare: 'var(--prepare)', pause: 'var(--pause)',
  finish: 'var(--finish)', failed: 'var(--error)', idle: 'var(--idle)',
};
const stateOf = g => STATE[g] || STATE.UNKNOWN;

const ICON = {
  pause: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>',
  swap: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>',
  printer: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>',
  bulbOn: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 21h6v-1H9v1zm3-19a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>',
  bulbOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9V16h7v-2.1A6 6 0 0012 3z"/></svg>',
  stage: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.24 7.76A5.97 5.97 0 0012 6v6l-4.24 2.45a6 6 0 108.48-6.69zM12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>',
};

let lastPrinters = [];
let lastCameras = [];
let selectedId = localStorage.getItem('hubSel') || '';
const pending = new Map(); // printerId -> 正在执行的动作名

const WIDE = () => window.matchMedia('(min-width: 1000px)').matches;

function selected() {
  if (!lastPrinters.length) return null;
  let p = lastPrinters.find(x => x.id === selectedId);
  if (!p) {
    p = lastPrinters[0];
    selectedId = p.id;
  }
  return p;
}

function byId(id) { return lastPrinters.find(p => p.id === id) || null; }

/* ---------------- 左栏: 打印机卡片 (MonitorPrinterCard) ---------------- */

function pressureSig(p) {
  return JSON.stringify([p.id, p.name, p.mode, p.plateSwap, p.conn,
    p.state || null, pending.get(p.id) || '']);
}

function pcardsHtml(list) {
  if (!list.length) {
    return `<div class="empty">${ICON.printer}
      <b>还没有打印机</b>
      <span>在 Mac 的 BambuDeck 里添加打印机，这里会自动出现</span></div>`;
  }
  return list.map(p => {
    const s = p.state;
    const g = s ? s.gcode : 'IDLE';
    const [zh, cls] = stateOf(g);
    const [connZh, connCls] = CONN[p.conn] || CONN.disconnected;
    const color = COLOR[cls];
    const pct = s ? (s.progress || 0) : 0;
    const stage = s && s.stage
      ? `<div class="stage">${ICON.stage}步骤 ${esc(s.stage)}</div>` : '';
    // 打印中永远给剩余时间, 0 分钟也写「0分钟」(和 app 的 fmtRemaining 一样)。
    const layer = s && s.printing
      ? `<div class="facts">层 ${s.layerNum || 0}/${s.totalLayers || 0} · 剩 ${fmtRemaining(s.remainingMinutes)}</div>`
      : '';
    const temps = s
      ? `喷嘴 ${fmtTemp(s.nozzleTemp, s.nozzleTarget)} · 热床 ${fmtTemp(s.bedTemp, s.bedTarget)}` +
        (s.chamberTemp > 0 ? ` · 腔体 ${Math.round(s.chamberTemp)}°` : '')
      : '';
    return `<div class="pcard${p.id === selectedId ? ' sel' : ''}" data-id="${esc(p.id)}">
      <div class="prow">
        <div class="pident">
          <div class="name">${esc(p.name)}</div>
          <div class="meta">${esc([p.mode, connZh].filter(Boolean).join(' · '))}</div>
        </div>
        ${s ? `<span class="badge ${cls}">${zh}</span>`
            : `<span class="dot ${connCls}"></span>`}
      </div>
      ${s ? `
      <div class="taskrow">
        <span class="task">${esc(s.subtaskName || '无任务')}</span>
        <span class="pct" style="color:${color}">${pct}%</span>
      </div>
      <div class="bar"><i style="width:${pct}%;background:${color}"></i></div>
      <div class="facts">${temps}</div>
      ${stage}${layer}
      ${s.doorOpen === true ? '<div class="door">舱门已开</div>' : ''}
      ${s.hasError ? `<div class="errchip" role="button" tabindex="0">ⓘ ${hmsLabel(s)}</div>` : ''}` : ''}
    </div>`;
  }).join('');
}

// 芯片文字和 App 的 MonitorPrinterCard 一致: 只有「报错」/「报错 N」,
// print_error 的细节在弹窗里。
function hmsLabel(s) {
  const n = (s.hms || []).length;
  return n > 1 ? `报错 ${n}` : '报错';
}

const SEVERITY = { fatal: '致命', serious: '严重', common: '一般', unknown: '未知' };

// App 的 showHmsDialog + HmsCard: 标题按条数, 内容按最严重一条着色。
function showHms(p) {
  const s = p ? p.state : null;
  if (!s) return;
  const hms = s.hms || [];
  $('modal-title').textContent = hms.length > 1
    ? `打印机报错 · ${hms.length} 条` : '打印机报错';
  const worst = s.hmsWorst === 0 ? 'fatal' : s.hmsWorst === 1 ? 'serious' : 'common';
  const entries = hms.map(e => `<div class="hms-entry">
      <div class="code">${esc(e.code)} · ${esc(SEVERITY[e.severity] || '未知')}</div>
      ${e.desc ? `<div class="desc">${esc(e.desc)}</div>` : ''}
    </div>`).join('');
  const fallback = s.printError && !hms.length
    ? `<div class="desc">${esc(s.printErrorDesc ||
        '打印机上报了错误码,等待详情推送…')}</div>` : '';
  $('modal-body').innerHTML = `<div class="hms-box ${worst}">
      <div class="hms-head">ⓘ ${s.printError
        ? `打印错误 (print_error ${esc(s.printError)})`
        : `HMS 错误 (${hms.length})`}</div>
      ${entries}${fallback}
    </div>`;
  $('modal').classList.add('show');
}

function closeModal() { $('modal').classList.remove('show'); svcModalOpen = false; }
$('modal-close').addEventListener('click', closeModal);
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('modal').classList.contains('show')) closeModal();
});

let railSig = null;
function renderRail(list) {
  const sig = list.map(pressureSig).join('|') + '#' + selectedId;
  $('rail-title').textContent = '打印机' + (list.length ? ` (${list.length})` : '');
  if (sig === railSig) return;
  railSig = sig;
  $('plist').innerHTML = pcardsHtml(list);
}

$('plist').addEventListener('click', e => {
  const card = e.target.closest('.pcard');
  if (!card) return;
  // 报错芯片先吃掉点击, 别顺带切到这台机器的详情。
  if (e.target.closest('.errchip')) { showHms(byId(card.dataset.id)); return; }
  select(card.dataset.id);
});
$('plist').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const chip = e.target.closest('.errchip');
  if (!chip) return;
  e.preventDefault();
  showHms(byId(chip.closest('.pcard').dataset.id));
});

function select(id) {
  if (id !== selectedId) {
    selectedId = id;
    localStorage.setItem('hubSel', id);
    paneSig = ''; amsSig = null; wallSig = null;
  }
  if (!WIDE()) document.body.dataset.view = 'detail';
  renderRail(lastPrinters);
  renderPane();
  syncWalls();
}

$('back').addEventListener('click', () => {
  document.body.dataset.view = 'list';
  syncWalls();
});

/* ---------------- 右栏: 选中打印机的 控制 + AMS + 摄像头墙 ---------------- */

let paneSig = '';
let amsSig = null;
let wallSig = null;

// 骨架只在「换机器 / 换状态有无 / 换盘能力变化」时重建; 数值每秒走
// updatePane, 免得每秒 innerHTML 把手指下的按钮换掉。
function paneKey(p) {
  return [p.id, p.plateSwap ? 1 : 0, p.state ? 1 : 0].join('|');
}

function renderPane() {
  const p = selected();
  $('ptitle').textContent = p ? p.name : '';
  if (!p) {
    paneSig = '';
    $('pnet').textContent = '';
    $('pane-body').innerHTML = `<div class="placeholder">
      <b>还没有打印机</b><span>在 Mac 的 BambuDeck 里添加打印机</span></div>`;
    return;
  }
  if (paneKey(p) !== paneSig) {
    paneSig = paneKey(p);
    amsSig = null; wallSig = null;
    buildPane(p);
  }
  updatePane(p);
  renderAms(p);
  renderWall(p);
}

function buildPane(p) {
  // 换机器会整块重画 pane-body, 旧的 <img> 连同流一起丢掉 —— 先明确摘掉,
  // 否则 MJPEG 请求会挂在那份被丢弃的 DOM 上继续占连接名额。
  dropStreams($('pane-body'));
  const s = p.state;
  if (!s) {
    $('pane-body').innerHTML = `<div class="placeholder">
      <div class="spin"></div><span>正在连接打印机…</span></div>`;
    return;
  }
  $('pane-body').innerHTML = `
    <div class="toprow">
      <div class="card ctl">
        <div class="ctl-title">控制</div>
        <div class="ctl-row">
          <div class="ctl-scroll">
          <button class="btn primary" id="b-pause" data-act="pause" aria-label="暂停" title="暂停">${ICON.pause}<span class="btn-txt">暂停</span></button>
          <button class="btn primary" id="b-resume" data-act="resume" aria-label="恢复" title="恢复">${ICON.play}<span class="btn-txt">恢复</span></button>
          <button class="btn icon danger" id="b-stop" data-act="stop" aria-label="停止" title="停止">${ICON.stop}</button>
          <span class="ctlgrp"><span class="lbl">速度</span>
            <div class="speed" id="speed">
              <button data-speed="1" title="静音" aria-label="静音">静</button>
              <button data-speed="2" title="标准" aria-label="标准">标</button>
              <button data-speed="3" title="运动" aria-label="运动">运</button>
              <button data-speed="4" title="狂暴" aria-label="狂暴">狂</button>
            </div>
          </span>
          <button class="btn icon lamp" id="lamp" type="button" aria-label="腔灯" title="开灯">${ICON.bulbOff}</button>
          ${p.plateSwap
            ? `<button class="btn outline" id="b-swap" data-act="plate-swap" aria-label="一键换盘" title="一键换盘">${ICON.swap}<span class="btn-txt">一键换盘</span></button>`
            : ''}
          </div>
          <button class="ams-chip" id="ams-chip" type="button" aria-label="AMS 状态" title="AMS 状态" hidden>
            <span class="t">AMS</span>
          </button>
        </div>
      </div>
      <div class="card amscard" id="ams"></div>
    </div>
    <div class="wall" id="camwall"></div>
    <div class="ams-pop" id="ams-pop">
      <div class="ams-pop-backdrop"></div>
      <div class="ams-pop-card" role="dialog" aria-label="AMS 状态">
        <div class="ams-pop-body" id="ams-pop-body"></div>
      </div>
    </div>`;
  // 手机上 AMS 只留一个「当前进料通道」的小芯片, 点开在旁边弹出全部信息。
  const chip = $('ams-chip');
  if (chip) chip.onclick = e => { e.stopPropagation(); openAmsPop(); };
  const pop = $('ams-pop');
  if (pop) pop.querySelector('.ams-pop-backdrop').onclick = closeAmsPop;
  markScrollables($('pane-body'));
}

/* 手机上一行放不下时给个渐隐提示 (见 .ctl-scroll.more)。
   AMS 行不滑动: 整台 AMS 换行, 不需要提示。 */
function markScrollables(root) {
  if (!root) return;
  requestAnimationFrame(() => {
    for (const row of root.querySelectorAll('.ctl-scroll')) {
      const overflow = () => row.scrollWidth - row.clientWidth > 2;
      const sync = () => {
        const atEnd = row.scrollLeft + row.clientWidth >= row.scrollWidth - 2;
        row.classList.toggle('more', overflow() && !atEnd);
      };
      sync();
      row.onscroll = sync;
      // 骨架可能是在「列表」状态下建的 (#pane 隐藏, 宽度 0), 等它显示出来
      // 宽度变了得重新判断一次, 否则渐隐提示一直不出现。
      if (window.ResizeObserver && !row._ro) {
        row._ro = new ResizeObserver(sync);
        row._ro.observe(row);
      }
    }
  });
}

// 每秒刷新数值和控制态 (按钮 DOM 不重建)。
function updatePane(p) {
  const s = p.state;
  const job = $('pjob');
  if (!s) {
    // 还没收到状态推送 (打印机离线/正在连): 头部只留名字和「未连接」。
    if (job) job.textContent = '';
    $('pnet').textContent = '未连接';
    return;
  }
  const net = [s.wifi != null ? `WiFi ${s.wifi} dBm` : '', s.ip || ''].filter(Boolean).join(' · ');
  $('pnet').textContent = net;
  if (job) {
    // 只有模型名会超长, 让它自己缩 (见 .pjob .jname), 进度和剩余时间不截。
    const bits = [];
    if (s.subtaskName) bits.push(`<span class="jname">${esc(s.subtaskName)}</span>`);
    if (s.printing) {
      bits.push(`<span class="jnum">${s.progress || 0}%</span>`);
      bits.push(`<span class="jnum">${s.layerNum || 0}/${s.totalLayers || 0}层</span>`);
      bits.push(`<span class="jnum">剩${fmtShortRemaining(s.remainingMinutes)}</span>`);
    }
    job.innerHTML = bits.join('<span class="jsep">·</span>');
  }

  const setHidden = (id, v) => { const el = $(id); if (el) el.hidden = v; };
  const busy = pending.get(p.id) != null;
  const g = s.gcode;
  setHidden('b-pause', !(g === 'RUNNING' && !busy));
  setHidden('b-resume', !(g === 'PAUSE' && !busy));
  const stop = $('b-stop');
  if (stop) stop.disabled = busy || !s.printing;

  const speed = $('speed');
  if (speed) {
    const cur = s.speedLevel > 0 ? s.speedLevel : 2;
    for (const b of speed.querySelectorAll('button')) {
      b.classList.toggle('on', Number(b.dataset.speed) === cur);
      b.disabled = busy;
    }
  }
  const lamp = $('lamp');
  if (lamp) {
    lamp.classList.toggle('on', !!s.light);
    lamp.innerHTML = s.light ? ICON.bulbOn : ICON.bulbOff;
    lamp.disabled = busy;
    lamp.title = s.light ? '关灯' : '开灯';
    lamp.setAttribute('aria-label', s.light ? '腔灯已开' : '腔灯已关');
  }

  if (busy) {
    const t = $('ptitle');
    if (t) t.textContent = p.name + ' · ' + busy + '中…';
  } else {
    $('ptitle').textContent = p.name;
  }
}

/* AMS 卡 (AmsCard / AmsStrip) */
function trayHtml(t, active, flow) {
  const color = t.color || '#262E37';
  const label = t.present && t.type ? t.type : '-';
  const pct = t.present && t.remain >= 0 ? t.remain + '%' : '';
  const flowTag = active
    ? `<span class="flow">${flow === 'unload' ? 'OUT' : 'IN'}</span>` : '';
  const playTag = active ? '<span class="play">▶</span>' : '';
  // flowTag 放在 .c 外面: 桌面端 absolute 盖在色块上, 手机端变成百分比
  // 后面的一小截 IN/OUT 文字 (色块缩小后塞不下)。
  return `<div class="tray${active ? ' active' : ''}">
    <div class="c" style="background:${esc(color)}">${playTag}</div>
    <div class="t${label === '-' ? ' blank' : ''}">${esc(label)}</div>
    <div class="p">${pct}</div>
    ${flowTag}
  </div>`;
}

function unitHtml(u, ams, flow) {
  const label = u.id >= 128 ? `AMS HT ${u.id - 127}` : `AMS${u.id + 1}`;
  // 手机上一行放不下, 湿度只留那个颜色点 + 数字, "RH" 前缀省掉。
  const hum = u.dry
    ? '<span class="dry">烘干中</span>'
    : `<span class="hum" title="湿度"><i style="background:${humColor(u)}"></i>${
        u.humidityRaw > 0 ? u.humidityRaw + '%' : '湿度 ' + u.humidity}</span>`;
  const trays = (u.trays || []).map((t, i) =>
    trayHtml(t, ams.activeId === u.id && ams.activeIndex === i, flow)).join('');
  return `<div class="ams-unit">
    <div class="uh"><b>${label}</b>${hum}</div>
    <div class="trays">${trays}</div>
  </div>`;
}

function humColor(u) {
  if (u.humidityRaw > 0) {
    return u.humidityRaw <= 40 ? 'var(--running)'
      : u.humidityRaw <= 60 ? 'var(--warning)' : 'var(--error)';
  }
  return u.humidity >= 4 ? 'var(--running)'
    : u.humidity <= 1 ? 'var(--error)' : 'var(--warning)';
}

/* 手机控制行最右边那颗芯片: 只显示当前进料的那一个通道。 */
function renderAmsChip(ams, stgCur) {
  const chip = $('ams-chip');
  if (!chip) return;
  if (!ams) { chip.hidden = true; return; }
  // 通道编号: AMS1 的第 3 个料盘 = A1F3, 外部料卷 = EXT, AMS HT = H1F2。
  let t = null, unit = '', code = '';
  if (ams.activeId === 254 && ams.vt) {
    t = ams.vt; unit = '外部料卷'; code = 'EXT';
  } else {
    const u = (ams.units || []).find(x => x.id === ams.activeId);
    if (u) {
      t = (u.trays || [])[ams.activeIndex];
      const n = u.id >= 128 ? u.id - 127 : u.id + 1;
      unit = u.id >= 128 ? `AMS HT${n}` : `AMS${n}`;
      code = (u.id >= 128 ? 'H' : 'A') + n + 'F' + (ams.activeIndex + 1);
    }
  }
  chip.hidden = false;
  if (!t || !t.present || !code) {
    // 没在进料 (空闲/刚开机): 芯片只是个入口。
    chip.innerHTML = '<span class="t">AMS</span>';
    chip.title = 'AMS 状态';
    return;
  }
  const pct = t.remain >= 0 ? t.remain + '%' : '';
  // 进料状态来自打印子阶段 stg_cur (24 进料 / 22 退料); 其余时候只显示通道。
  const flow = stgCur === 24 ? 'load' : stgCur === 22 ? 'unload' : 'none';
  const badge = flow === 'none' ? ''
    : `<span class="play">${flow === 'unload' ? '◀' : '▶'}</span>`;
  chip.innerHTML = `<span class="c" style="background:${esc(t.color || '#262E37')}">` +
    `${badge}</span><span class="t">${code}</span>`;
  const doing = flow === 'load' ? ' · 进料中' : flow === 'unload' ? ' · 退料中' : '';
  chip.title = `${unit} 第${ams.activeIndex + 1}盘 · ${t.type || ''} ${pct}`.trim() + doing;
}

/* 弹层贴在芯片右下: 右边缘对齐, 下方展开, 不跳页。 */
function openAmsPop() {
  const pop = $('ams-pop'), chip = $('ams-chip');
  if (!pop || !chip || chip.hidden) return;
  const card = pop.querySelector('.ams-pop-card');
  const r = chip.getBoundingClientRect();
  const w = Math.min(360, window.innerWidth - 24);
  card.style.width = w + 'px';
  // 右边缘对齐芯片; 屏幕太窄时至少离左边 12px。
  card.style.right = Math.max(12, Math.min(window.innerWidth - r.right,
                                           window.innerWidth - w - 12)) + 'px';
  card.style.left = 'auto';
  card.style.top = (r.bottom + 6) + 'px';
  card.style.maxHeight = Math.max(120, window.innerHeight - r.bottom - 20) + 'px';
  pop.classList.add('open');
}

function closeAmsPop() {
  const pop = $('ams-pop');
  if (pop) pop.classList.remove('open');
}

function renderAms(p) {
  const el = $('ams');
  if (!el) return;
  const s = p.state;
  const ams = s && s.ams;
  const sig = JSON.stringify([p.id, ams || null, s ? s.stgCur : null]);
  if (sig === amsSig) return;
  amsSig = sig;
  renderAmsChip(ams, s ? s.stgCur : -1);
  if (!ams) {
    el.innerHTML = '<span class="ams-none">未检测到 AMS</span>';
    const body = $('ams-pop-body');
    if (body) body.innerHTML = '<span class="ams-none">未检测到 AMS</span>';
    return;
  }
  // 进料/退料方向来自打印子阶段 stg_cur (24 进料 / 22 退料)。
  const flow = s.stgCur === 24 ? 'load' : s.stgCur === 22 ? 'unload' : 'none';
  const parts = (ams.units || []).map(u => unitHtml(u, ams, flow));
  if (ams.vt) {
    // 「外部」就够认了, 手机上看不到「料卷」两个字 (见 .uh .rest)。
    parts.push(`<div class="ams-unit">
      <div class="uh"><b>外部<span class="rest">料卷</span></b></div>
      <div class="trays">${trayHtml(ams.vt, ams.activeId === 254, flow)}</div>
    </div>`);
  }
  const html = parts.length
    ? `<div class="ams-row">${parts.join('')}</div>`
    : '<span class="ams-none">AMS 未连接</span>';
  el.innerHTML = html;
  // 桌面端是那张卡; 手机端同一份内容放进弹层里。
  const body = $('ams-pop-body');
  if (body) body.innerHTML = html;
  markScrollables(el);
}

/* ---------------- 摄像头卡片 (App 的 CameraTile) ---------------- */

const CAM_ICON = {
