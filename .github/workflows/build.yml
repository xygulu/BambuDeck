name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
        working-directory: apps/deck
      - run: flutter build apk --release
        working-directory: apps/deck
      - uses: actions/upload-artifact@v4
        with:
          name: deck-android-apk
          path: apps/deck/build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
        working-directory: apps/deck
      - run: flutter build windows --release
        working-directory: apps/deck
      - uses: actions/upload-artifact@v4
        with:
          name: deck-windows
          path: apps/deck/build/windows/x64/runner/Release
      # 独立网页服务 (deck_hub): 供另一台 Windows 机器部署, 目标机不装 Flutter。
      - run: dart pub get
        working-directory: apps/deck
      - run: dart build cli -o build/hub
        working-directory: apps/deck
      # 组装免配置部署包:hub.exe + assets + 服务脚本 打成一个 zip,
      # 拷到 Windows 机器解压即可 install-service.bat 注册成开机自启服务。
      - name: Assemble hub deploy package
        shell: pwsh
        run: |
          $d = 'deploy/deck-hub-windows'
          New-Item -ItemType Directory -Force -Path "$d/assets/web","$d/assets/plate_swap" | Out-Null
          Copy-Item build/hub/bundle/bin/hub.exe "$d/"
          Copy-Item assets/web/hub_page.html "$d/assets/web/"
          Copy-Item assets/plate_swap/auto_plate_swap.3mf "$d/assets/plate_swap/"
          Copy-Item tool/hub-windows/*.cmd, tool/hub-windows/*.bat, tool/hub-windows/README.md "$d/"
          Compress-Archive -Path "$d/*" -DestinationPath deploy/deck-hub-windows.zip -Force
        working-directory: apps/deck
      - uses: actions/upload-artifact@v4
        with:
          name: deck-hub-windows
          path: apps/deck/deploy/deck-hub-windows.zip
