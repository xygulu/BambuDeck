name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
        working-directory: apps/deck
      - run: flutter build apk --release
        working-directory: apps/deck
      - uses: actions/upload-artifact@v4
        with:
          name: deck-android-apk
          path: apps/deck/build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
        working-directory: apps/deck
      - run: flutter build windows --release
        working-directory: apps/deck
      - uses: actions/upload-artifact@v4
        with:
          name: deck-windows
          path: apps/deck/build/windows/x64/runner/Release
      # 独立网页服务 (deck_hub): 供另一台 Windows 机器部署, 目标机不装 Flutter。
      - run: dart pub get
        working-directory: apps/deck
      - run: dart build cli -o build/hub
        working-directory: apps/deck
      - uses: actions/upload-artifact@v4
        with:
          name: deck-hub-windows
          path: |
            apps/deck/build/hub/bundle/**
            apps/deck/assets/web/hub_page.html
            apps/deck/assets/plate_swap/auto_plate_swap.3mf
